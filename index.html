/* Layout : une salle de régulation. Files d'appels et interventions à gauche, carte du secteur au centre
   avec la radio dessous, poste de traitement de l'appel à droite. Les quatre couleurs de service sont le seul code couleur. */
:root {
  --bg: #e8ecf0;
  --panel: #fbfcfd;
  --panel-2: #f0f3f6;
  --ink: #16202b;
  --muted: #5a6775;
  --line: #d2d9e1;
  --focus: #1d5fb8;
  --badge-ink: #ffffff;

  --s18: #c4352b;   /* Pompiers */
  --s15: #b9730b;   /* SAMU */
  --s17: #2259b8;   /* Police */
  --s17g: #463e93;  /* Gendarmerie */
  --s112: #16202b;

  --good: #2c7a47;
  --warn: #a96600;
  --crit: #c4352b;

  --map-land: #e5e9de;
  --map-forest: #d0dbc5;
  --map-water: #b6cddf;
  --map-road: #ffffff;
  --map-road-edge: #bdc4b8;
  --map-block: #cdd2cd;
  --map-text: #34404b;
  --map-zone: #2259b8;
  --shield: #f2c418;
  --shield-ink: #1b1b1b;
  --motorway: #c4222f;
  --map-major: #f6dc85;

  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1318; --panel: #151c23; --panel-2: #1b242d; --ink: #e2e8ee; --muted: #94a1ae; --line: #29343f;
    --focus: #72a6ee; --badge-ink: #0e1318;
    --s18: #ee6a5c; --s15: #e6a440; --s17: #6f9ef0; --s17g: #a198ea; --s112: #e2e8ee;
    --good: #5fc282; --warn: #e5a63f; --crit: #ee6a5c;
    --map-land: #19211c; --map-forest: #1e2b22; --map-water: #1d3243; --map-road: #3a4551; --map-road-edge: #0f1419;
    --map-block: #2b3440; --map-text: #b8c3ce; --map-zone: #6f9ef0; --map-major: #6e6232;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1318; --panel: #151c23; --panel-2: #1b242d; --ink: #e2e8ee; --muted: #94a1ae; --line: #29343f;
  --focus: #72a6ee; --badge-ink: #0e1318;
  --s18: #ee6a5c; --s15: #e6a440; --s17: #6f9ef0; --s17g: #a198ea; --s112: #e2e8ee;
  --good: #5fc282; --warn: #e5a63f; --crit: #ee6a5c;
  --map-land: #19211c; --map-forest: #1e2b22; --map-water: #1d3243; --map-road: #3a4551; --map-road-edge: #0f1419;
  --map-block: #2b3440; --map-text: #b8c3ce; --map-zone: #6f9ef0; --map-major: #6e6232;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 14px;
  line-height: 1.45;
  overflow: hidden;
}
* { box-sizing: border-box; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr) 410px;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "head head head" "left map right";
  gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- En-tête ---------- */
.head {
  grid-area: head;
  display: flex; align-items: center; flex-wrap: wrap; gap: 12px 24px;
}
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand h1 {
  margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 28px; letter-spacing: 0.02em;
  text-transform: uppercase; line-height: 1;
}
.brand .sector { color: var(--muted); font-size: 13px; }
.clock { font-family: var(--f-mono); font-size: 22px; font-weight: 500; letter-spacing: 0.02em; }
.stats { display: flex; gap: 20px; margin-left: auto; flex-wrap: wrap; }
.stat { display: grid; gap: 0; }

/* Point à la fraction t (0 à 1) le long d'une polyligne */
function along(pts, t) {
  let total = 0; for (let i = 1; i < pts.length; i++) total += dist(pts[i - 1], pts[i]);
  let goal = total * t;
  for (let i = 1; i < pts.length; i++) { const d = dist(pts[i - 1], pts[i]); if (goal <= d) { const r = goal / d; return { x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * r, y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * r }; } goal -= d; }
  return { ...pts[pts.length - 1] };

/* Géographie réelle : limites communales IGN (Admin Express) embarquées dans COMMUNES_GEO */

function inPoly(p, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const a = ring[i], b = ring[j];
    if ((a.y > p.y) !== (b.y > p.y) && p.x < (b.x - a.x) * (p.y - a.y) / (b.y - a.y) + a.x) inside = !inside;

}

  return c.polys.some(poly => inPoly(p, poly[0]) && !poly.slice(1).some(hole => inPoly(p, hole)));

/* Plus court chemin sur le réseau routier (Dijkstra) */
function dijkstra(src) {
  const d = {}, prev = {}, Q = new Set(Object.keys(NODES));
  for (const k of Q) d[k] = Infinity;
  d[src] = 0;
  while (Q.size) {
    let u = null;
    for (const k of Q) if (u === null || d[k] < d[u]) u = k;
    Q.delete(u);
    for (const { to, len } of ADJ[u]) if (Q.has(to) && d[u] + len < d[to]) { d[to] = d[u] + len; prev[to] = u; }
  }
  return { d, prev };
}
const DIJ = {};
function dij(src) { return DIJ[src] || (DIJ[src] = dijkstra(src)); }
function nearestNode(p) {
  let best = null, bd = Infinity;
  for (const k in NODES) { const dd = dist(p, NODES[k]); if (dd < bd) { bd = dd; best = k; } }
  return best;
}
/* Itinéraire : du point de départ au nœud le plus proche, puis par la route jusqu'à la cible */
function route(from, to, toNodes) {
  const s = nearestNode(from);
  const { d, prev } = dij(s);
  let best = toNodes[0], bc = Infinity;
  for (const c of toNodes) { const cost = d[c] + dist(NODES[c], to); if (cost < bc) { bc = cost; best = c; } }
  const chain = [];
  let k = best;
  while (k !== undefined) { chain.unshift(k); if (k === s) break; k = prev[k]; }
  const pts = [{ x: from.x, y: from.y }, { x: NODES[chain[0]].x, y: NODES[chain[0]].y }];
  for (let i = 1; i < chain.length; i++) {
    const e = edgeBetween(chain[i - 1], chain[i]);
    const seg = e.a === chain[i - 1] ? e.pts : e.pts.slice().reverse();
    pts.push(...seg.slice(1));
  }
  pts.push({ x: to.x, y: to.y });
  let len = 0;
  for (let i = 1; i < pts.length; i++) len += dist(pts[i - 1], pts[i]);
  return { pts, len };
}

/* Génère un lieu d'intervention selon le type demandé par le scénario */
const QUARTIERS = Object.keys(NODES).filter(k => NODES[k].kind === "quartier");
const COMMUNES = Object.keys(NODES).filter(k => NODES[k].kind === "bourg" || NODES[k].kind === "village");
const RURAL = ["levens", "tourrette", "aspremont", "falicon", "colomars", "st_martin_var", "contes", "lescarene",
  "gattieres", "st_jeannet", "la_gaude", "eze", "la_turbie", "carros", "vence"];
function makeLocation(kind) {
  const roads = EDGES.filter(e => !e.urban && e.len > 1.2 * KM);
  if (kind === "route" || (kind === "rural" && Math.random() < 0.4)) {
    const pool = kind === "route" ? roads : roads.filter(r => RURAL.includes(r.a) || RURAL.includes(r.b));
    for (let tries = 0; tries < 40; tries++) {
      const e = pick(pool);
      const p = along(e.pts, rand(0.3, 0.7));
      if (!onLand(p)) continue;
      const between = `entre ${fullName(e.a)} et ${fullName(e.b)}`;
      const onRoad = /^[AM] /.test(e.road) ? `${e.road.startsWith("A") ? "l'" : "la "}${e.road}` : e.road;
      return { ...p, nodes: [e.a, e.b], zone: zoneOf(p), address: `${e.road}, ${between}`,
        spoken: `Sur ${onRoad}, ${between}.`, short: e.road };
    }
  }
  const n = kind === "ville" ? pick(QUARTIERS)
    : kind === "rural" ? pick(RURAL)
    : Math.random() < 0.55 ? pick(QUARTIERS) : pick(COMMUNES);
  const N = NODES[n];
  const expected = N.kind === "quartier" ? "Nice" : norm(N.name);
  let p = { x: N.x, y: N.y };
  for (let tries = 0; tries < 30; tries++) { // dans la bonne commune, jamais dans la mer
    const r = (N.kind === "quartier" ? rand(0.15, 0.55) : N.kind === "bourg" ? rand(0.15, 0.7) : rand(0.05, 0.3)) * KM;
    const a = rand(0, Math.PI * 2);
    const q = { x: N.x + Math.cos(a) * r, y: N.y + Math.sin(a) * r };
    if (communeAt(q) === expected) { p = q; break; }
  }
  const num = Math.floor(rand(1, 80)), street = pick(N.streets || STREETS);
  const town = N.kind === "quartier" ? "Nice" : N.name;
  return { ...p, nodes: [n], zone: zoneOf(p), address: `${num} ${street}, ${town}`,
    spoken: `Au ${num} ${street}, à ${town}.`, short: N.kind === "quartier" ? `Nice · ${N.name}` : N.name };
}

      { q: "Quel est votre nom et votre âge ?", a: "(rires) Euh… Kevin, douze ans. (il raccroche)", key: true },
      { q: "Voyez-vous des flammes ou de la fumée ?", a: "Ouais, plein ! (rires derrière lui)", key: false },
    ],
    expected: [], transport: false, bilan: "" },
];
for (const sc of SCENARIOS) {
  const addr = sc.addr || {};
  sc.allQ = [
    { id: sc.id + "-adr", q: "Quelle est l'adresse exacte ?", a: addr.a || "{adr}", key: addr.key !== false, reveal: addr.reveal !== false },
    ...sc.questions.map((q, i) => ({ ...q, id: sc.id + "-" + i })),
  ];
}

/* =========================================================
   5. État du jeu
   ========================================================= */
let speed = 1, paused = true, started = false, soundOn = false;
let elapsed = 0, nextSpawn = 0, callSeq = 0, interSeq = 0, msgSeq = 0;
let bag = [];
const calls = [], inters = [], radio = [];
const stats = { done: 0, total: 0, lost: 0 };
let selected = null; // { kind: "call" | "inter", id }
let dirty = { left: true, right: true, radio: true };

function svcOfNumero(n) { return n === "112" ? "18" : n; }
function numClass(n, zone) { return n === "17" && zone === "G" ? "n17g" : "n" + (n === "112" ? "112" : n); }
function nextScenario() {
  if (!bag.length) bag = SCENARIOS.slice().sort(() => Math.random() - 0.5);
  return bag.pop();
}
function say(svc, text) {
  radio.unshift({ id: ++msgSeq, t: elapsed, svc, text });
  if (radio.length > 60) radio.pop();
  dirty.radio = true;
}

function spawnCall() {
  const sc = nextScenario();
  let numero = sc.numero;
  if (sc.allow112 && Math.random() < 0.25) numero = "112";
  const loc = makeLocation(sc.lieu);
  calls.push({ id: "c" + (++callSeq), sc, numero, loc, ringStart: elapsed, answered: false,
    asked: new Set(), transcript: [], qcost: 0, addressKnown: false,
    open: new Set([svcOfNumero(numero)]), nature: "", sel: new Set(), hint: "" });
  beep();
  dirty.left = true;
  if (!selected) { /* laisse le joueur choisir */ }
}

function greeting(call) {
  if (call.numero === "15") return "SAMU, bonsoir, je vous écoute.";
  if (call.numero === "18") return "Pompiers, bonsoir.";
  if (call.numero === "112") return "Numéro d'urgence 112, bonsoir.";
  return call.loc.zone === "P" ? "Police secours, j'écoute." : "Gendarmerie nationale, j'écoute.";
}

function answer(call) {
  if (call.answered) return;
  call.answered = true;
  call.transcript.push({ who: "op", text: greeting(call) });
  call.transcript.push({ who: "ap", text: call.sc.opening });
  dirty.left = dirty.right = true;
}

function ask(call, qid) {
  const q = call.sc.allQ.find(x => x.id === qid);
  if (!q || call.asked.has(qid)) return;
  call.asked.add(qid);
  call.qcost += Q_COST;
  call.transcript.push({ who: "op", text: q.q });
  call.transcript.push({ who: "ap", text: q.a.replace("{adr}", q.special ? call.loc.address + "." : call.loc.spoken) });
  if (q.reveal) call.addressKnown = true;
  dirty.right = dirty.left = true;
}

function interconnect(obj, svc) {
  if (obj.open.has(svc)) return;
  obj.open.add(svc);
  obj.qcost = (obj.qcost || 0) + IC_COST;
  say("sys", `Interconnexion avec le ${svc} (${SVC_NAME[svc]}).`);
  dirty.right = true;
}

function propose(obj, loc, natureId) {
  const n = NATURE[natureId];
  if (!n) return "Choisissez d'abord une nature.";
  if (!n.depart.length) { obj.sel.clear(); return "Cette nature ne demande aucun moyen."; }
  const chosen = new Set(), missing = [];
  for (const t of n.depart) {
    const cands = UNITS.filter(u => u.status === "dispo" && !chosen.has(u.id) && !obj.sel.has(u.id) && typeMatches(t, u.type, loc.zone));
    if (!cands.length) { missing.push(SLOT_LABEL[t]); continue; }
    cands.sort((a, b) => etaFor(a, loc) - etaFor(b, loc));
    chosen.add(cands[0].id);
  }
  obj.sel = new Set([...obj.sel, ...chosen]);
  return missing.length ? `Aucun moyen disponible pour : ${missing.join(", ")}.` : `Départ type proposé : ${chosen.size} moyen(s).`;
}

function engageCall(call) {
  const inter = {
    id: "i" + (++interSeq), num: interSeq, sc: call.sc, nature: call.nature, loc: call.loc,
    received: call.numero, open: new Set(call.open), units: [], createdAt: call.ringStart,
    firstEngageAt: null, firstArrivalAt: null, qcost: call.qcost, asked: new Set(call.asked),
    transcript: call.transcript.slice(), requests: [], closed: false, score: null, transportBy: null, sel: new Set(),
  };
  inters.unshift(inter);
  calls.splice(calls.indexOf(call), 1);
  const ids = [...call.sel];
  if (ids.length) engage(inter, ids);
  else closeInter(inter, "Appel clôturé sans engagement.");
  selected = { kind: "inter", id: inter.id };
  dirty.left = dirty.right = true;
}

function engage(inter, ids) {
  const labels = [];
  for (const id of ids) {
    const u = UNIT[id];
    if (!u || u.status !== "dispo") continue;
    u.status = "alerte"; u.timer = alertDelay(u); u.inter = inter.id;
    inter.units.push({ uid: id, at: elapsed, late: inter.firstArrivalAt !== null });
    labels.push(u.label);
  }
  if (labels.length && inter.firstEngageAt === null) inter.firstEngageAt = elapsed;
  if (labels.length) say("sys", `#${inter.num} · engagé : ${labels.join(", ")}.`);
  inter.sel = new Set();
  dirty.left = dirty.right = true;
}

/* =========================================================
   6. Simulation
   ========================================================= */
function sendTo(u, target, nodes, mul = 1) {
  const r = route({ x: u.x, y: u.y }, target, nodes);
  u.path = r.pts; u.pi = 0; u.speedNow = TYPES[u.type].speed * mul;
}
function move(u, gdt) {
  let remain = u.speedNow * gdt;
  while (remain > 0 && u.pi < u.path.length - 1) {
    const b = u.path[u.pi + 1], d = dist(u, b);
    if (d <= remain) { u.x = b.x; u.y = b.y; u.pi++; remain -= d; }
    else { u.x += (b.x - u.x) / d * remain; u.y += (b.y - u.y) / d * remain; remain = 0; }
  }
  return u.pi >= u.path.length - 1;
}
function goHome(u) {
  u.status = "retour"; u.inter = null;
  sendTo(u, u.base, [u.base.node]);
}
function interById(id) { return inters.find(i => i.id === id); }

function slotsOf(sc) {
  return [...sc.expected.map(s => ({ s, late: false })), ...(sc.lateNeeds || []).map(s => ({ s, late: true }))]
    .sort((a, b) => a.s.length - b.s.length);
}
function matchSlots(slots, recs, zone) {
  const used = new Set();
  const res = slots.map(sl => {
    const found = recs.find(r => !used.has(r) && sl.s.some(t => typeMatches(t, r.type, zone)));
    if (found) used.add(found);
    return found || null;
  });
  return { res, extra: recs.filter(r => !used.has(r)) };
}
function recsOf(inter) { return inter.units.map(r => ({ type: UNIT[r.uid].type, label: UNIT[r.uid].label, rec: r })); }

function onArrival(inter, u) {
  say(unitSvcClass(u), `${u.label} sur les lieux (#${inter.num}).`);
  if (inter.firstArrivalAt !== null) return;
  const sc = inter.sc;
  // Le bilan vient du premier moyen utile arrivé sur place, pas d'un moyen engagé à tort
  const useful = slotsOf(sc).some(sl => sl.s.some(t => typeMatches(t, u.type, inter.loc.zone)));
  if (!useful) { say(unitSvcClass(u), `${u.label} : situation hors de nos compétences, nous attendons les secours adaptés.`); return; }
  inter.firstArrivalAt = elapsed;
  if (sc.bilan) say(unitSvcClass(u), `${u.label} : ${sc.bilan}`);
  const expectedSlots = sc.expected.map(s => ({ s, late: false })).sort((a, b) => a.s.length - b.s.length);
  const { res } = matchSlots(expectedSlots, recsOf(inter), inter.loc.zone);
  expectedSlots.forEach((sl, i) => {
    if (!res[i]) {
      inter.requests.push({ s: sl.s });
      say(unitSvcClass(u), `${u.label} : demande ${sl.s.map(t => SLOT_LABEL[t]).join(" ou ")} en renfort.`);
    }
  });
  for (const s of sc.lateNeeds || []) inter.requests.push({ s });
  if (sc.lateMsg) say(unitSvcClass(u), sc.lateMsg);
  dirty.right = true;
}

function updateUnit(u, gdt) {
  switch (u.status) {
    case "alerte":
      u.timer -= gdt;
      if (u.timer <= 0) {
        const inter = interById(u.inter);
        if (!inter) { goHome(u); break; }
        u.status = "parti";
        sendTo(u, inter.loc, inter.loc.nodes);
        dirty.right = true;
      }
      break;
    case "parti":
      if (move(u, gdt)) {
        const inter = interById(u.inter);
        u.status = "surplace";
        u.timer = TYPES[u.type].onScene * rand(0.85, 1.15);
        if (inter) onArrival(inter, u);
        dirty.right = dirty.left = true;
      }
      break;
    case "surplace":
      u.timer -= gdt;
      if (u.timer <= 0) {
        const inter = interById(u.inter);
        const canCarry = TYPES[u.type].transport;
        if (inter && inter.sc.transport && canCarry && !inter.transportBy) {
          inter.transportBy = u.id;
          u.status = "transport";
          sendTo(u, HOSPITAL, [HOSPITAL.node], 0.85);
          say(unitSvcClass(u), `${u.label} : transport vers ${HOSPITAL_NAME} (#${inter.num}).`);
        } else if (inter && u.type === "SMUR" && inter.transportBy && UNIT[inter.transportBy].status === "transport") {
          u.status = "transport";
          sendTo(u, HOSPITAL, [HOSPITAL.node], 0.85);
        } else {
          goHome(u);
        }
        dirty.right = dirty.left = true;
      }
      break;
    case "transport":
      if (move(u, gdt)) { u.status = "hopital"; u.timer = 240; dirty.right = true; }
      break;
    case "hopital":
      u.timer -= gdt;
      if (u.timer <= 0) { goHome(u); dirty.right = dirty.left = true; }
      break;
    case "retour":
      if (move(u, gdt)) { u.status = "dispo"; u.x = u.base.x; u.y = u.base.y; dirty.right = true; }
      break;
  }
}

function update(gdt) {
  elapsed += gdt;
  if (started && elapsed >= nextSpawn) {
    const ringing = calls.filter(c => !c.answered).length;
    if (ringing < 3) spawnCall();
    nextSpawn = elapsed + rand(240, 480);
  }
  for (const c of calls.slice()) {
    if (!c.answered && elapsed - c.ringStart > RING_TIMEOUT) {
      calls.splice(calls.indexOf(c), 1);
      stats.lost++;
      say("sys", `Appel ${c.numero} perdu : l'appelant a raccroché après 6 minutes d'attente.`);
      if (selected && selected.id === c.id) selected = null;
      dirty.left = dirty.right = true;
    }
  }
  for (const u of UNITS) if (u.status !== "dispo") updateUnit(u, gdt);
  for (const inter of inters) {
    if (!inter.closed && inter.units.length && inter.units.every(r => UNIT[r.uid].inter !== inter.id)) {
      closeInter(inter, `Intervention #${inter.num} terminée.`);
    }
  }
}

function forceClose(inter) {
  for (const r of inter.units) {
    const u = UNIT[r.uid];
    if (u.inter === inter.id) goHome(u);
  }
  closeInter(inter, `Intervention #${inter.num} clôturée par l'opérateur, moyens rappelés.`);
}

function closeInter(inter, text) {
  if (inter.closed) return;
  inter.closed = true;
  inter.closedAt = elapsed;
  inter.score = scoreInter(inter);
  stats.done++; stats.total += inter.score.total;
  say("sys", `${text} Score : ${inter.score.total}/100.`);
  dirty.left = dirty.right = true;
}

/* =========================================================
   7. Score
   ========================================================= */
function fmtDur(s) { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function fmtMin(s) { return `${Math.max(1, Math.round(s / 60))} min`; }
function fmtClock(s) {
  const t = Math.floor(START_CLOCK + s);
  return [Math.floor(t / 3600) % 24, Math.floor(t / 60) % 60, t % 60].map(v => String(v).padStart(2, "0")).join(":");
}

function scoreInter(inter) {
  const sc = inter.sc, zone = inter.loc.zone, notes = [];
  const recs = recsOf(inter);
  const slots = slotsOf(sc);
  const { res, extra } = matchSlots(slots, recs, zone);

  // Pertinence des moyens (40)
  let credit = 0, pen = 0;
  slots.forEach((sl, i) => {
    const m = res[i];
    if (!m) notes.push(`Manquait ${sl.s.map(t => SLOT_LABEL[t]).join(" ou ")}.`);
    else if (m.rec.late && !sl.late) { credit += 0.6; notes.push(`${m.label} engagé seulement en renfort.`); }
    else credit += 1;
  });
  const tol = sc.tolerated || [];
  let wrongCount = 0;
  for (const r of extra) {
    if (wrongZone({ type: r.type }, zone)) { wrongCount++; pen += 0.25; notes.push(`${r.label} engagé hors de sa zone de compétence.`); }
    else if (!tol.includes(r.type)) { pen += 0.15; notes.push(`${r.label} n'était pas nécessaire.`); }
  }
  let pert = slots.length ? clamp(credit / slots.length - pen, 0, 1) : clamp(1 - 0.25 * recs.length, 0, 1);
  if (!slots.length && recs.length) notes.push("Aucun moyen ne devait être engagé.");

  // Délais (25)
  let delai = 1;
  const T1 = sc.prio === "P1" ? 120 : 240;
  if (slots.length) {
    if (inter.firstEngageAt === null) { delai = 0; }
    else {
      const t = inter.firstEngageAt - inter.createdAt + inter.qcost;
      delai = clamp(1 - (t - T1) / 360, 0, 1);
      notes.push(`Premier engagement à ${fmtDur(t)} après la sonnerie (objectif ${fmtDur(T1)}).`);
    }
  }

  // Questionnement (20)
  const keys = sc.allQ.filter(q => q.key);
  const keyIds = new Set(keys.map(q => q.id));
  const askedKeys = keys.filter(q => inter.asked.has(q.id));
  const useless = [...inter.asked].filter(id => !keyIds.has(id)).length;
  let quest = keys.length ? askedKeys.length / keys.length : 1;
  quest = clamp(quest - 0.1 * Math.max(0, useless - 1), 0, 1);
  keys.filter(q => !inter.asked.has(q.id)).slice(0, 2).forEach(q => notes.push(`Question clé non posée : « ${q.q} »`));

  // Coordination (15)
  const recv = svcOfNumero(inter.received);
  const required = new Set();
  for (const sl of slots) {
    const svcs = new Set(sl.s.map(t => t === "PATROUILLE" ? "17" : TYPES[t].svc));
    if (svcs.size === 1) { const v = [...svcs][0]; if (v !== recv) required.add(v); }
  }
  let coord = required.size ? [...required].filter(v => inter.open.has(v)).length / required.size : 1;
  [...required].filter(v => !inter.open.has(v)).forEach(v => notes.push(`Le ${v} (${SVC_NAME[v]}) n'a pas été prévenu.`));
  const usedSvcs = new Set(recs.map(r => TYPES[r.type].svc));
  for (const v of inter.open) {
    if (v !== recv && !usedSvcs.has(v) && !required.has(v)) { coord -= 0.15; notes.push(`Interconnexion inutile avec le ${v}.`); }
  }
  coord = clamp(coord - 0.25 * wrongCount, 0, 1);

  const total = Math.round(40 * pert + 25 * delai + 20 * quest + 15 * coord);
  return { total, parts: [["Pertinence des moyens", pert, 40], ["Délais", delai, 25], ["Questionnement", quest, 20], ["Coordination", coord, 15]], notes };
}
function verdict(t) { return t >= 85 ? ["Excellent", "sc-good"] : t >= 65 ? ["Correct", "sc-good"] : t >= 40 ? ["À revoir", "sc-warn"] : ["Insuffisant", "sc-crit"]; }

/* =========================================================
   8. Interface
   ========================================================= */
const $ = s => document.querySelector(s);

/* Pictogrammes des services (dessins originaux, 24 × 24) : flamme, cœur et tracé, écusson, képi */
const PICTO = {
  s18: bg => `<path d="M12 2.2c.9 3.9-3.2 5.6-3.2 9.3 0 1.5 1.1 2.6 2.5 2.6 1.7 0 2.6-1.5 2.1-3.7 2.6 1.5 4.3 4.1 4.3 6.6 0 3.2-2.7 5.8-5.9 5.8s-5.9-2.6-5.9-5.9c0-5.2 5.5-7.8 6.1-14.7z"/>`,
  s15: bg => `<path d="M12 20.8s-7.6-4.5-9.3-9.1C1.5 8.4 3.5 4.8 7 4.8c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.5 0 5.5 3.6 4.3 6.9-1.7 4.6-9.3 9.1-9.3 9.1z"/><path d="M3.6 12.2h4.1l1.6-3 2.8 6 1.7-3h6.6" style="fill:none;stroke:${bg};stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round"/>`,
  s17: bg => `<path d="M12 2.2l8 3v6.1c0 5-3.4 9.3-8 10.9-4.6-1.6-8-5.9-8-10.9V5.2l8-3z"/><path d="M12 7l1.4 2.8 3.1.5-2.3 2.2.6 3.1-2.8-1.5-2.8 1.5.6-3.1-2.3-2.2 3.1-.5z" style="fill:${bg}"/>`,
  s17g: bg => `<path d="M6.2 10C6.2 6.6 8.8 4.4 12 4.4s5.8 2.2 5.8 5.6v4.2H6.2V10z"/><path d="M6.2 11.6h11.6" style="fill:none;stroke:${bg};stroke-width:1.5"/><path d="M3.6 15.4h17c0 1.6-1.1 2.8-2.8 2.8H7c-1.9 0-3.4-1.1-3.4-2.8z"/>`,
};
function picto(key) { return `<svg viewBox="0 0 24 24" aria-hidden="true" style="fill:var(--badge-ink)">${PICTO[key](`var(--${key})`)}</svg>`; }
function pic(key, extra = "") { return `<span class="pic ${extra} ${key}">${picto(key)}</span>`; }

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function renderHead() {
  $("#clock").textContent = fmtClock(elapsed);
  $("#st-score").textContent = stats.done ? Math.round(stats.total / stats.done) + "/100" : "–";
  $("#st-done").textContent = stats.done;
  $("#st-lost").textContent = stats.lost;
}

function renderLeft() {
  const cl = $("#calls");
  $("#calls-count").textContent = calls.length;
  cl.innerHTML = calls.length ? calls.map(c => {
    const sel = selected && selected.id === c.id ? " sel" : "";
    const ring = c.answered ? "" : " ringing";
    const t1 = c.answered ? (c.addressKnown ? esc(c.loc.short) : "En ligne") : "Appel entrant";
    const t2 = c.answered ? (c.nature ? esc(NATURE[c.nature].label) : "Questionnement en cours") : "Cliquez pour décrocher";
    return `<button class="row${sel}${ring}" type="button" data-select="call" data-id="${c.id}">
      <span class="badge ${numClass(c.numero, c.loc.zone)}">${c.numero}</span>
      <span class="mid"><span class="t1">${t1}</span><span class="t2">${t2}</span></span>
      <span class="side" data-since="${c.ringStart}">${fmtDur(elapsed - c.ringStart)}</span></button>`;
  }).join("") : `<div class="empty">${started ? "Aucun appel en attente." : "La garde n'a pas commencé."}</div>`;

  const il = $("#inters");
  const active = inters.filter(i => !i.closed), closed = inters.filter(i => i.closed).slice(0, 6);
  $("#inters-count").textContent = active.length;
  const rowFor = i => {
    const sel = selected && selected.id === i.id ? " sel" : "";
    const label = i.nature ? NATURE[i.nature].label : "Nature non qualifiée";
    let side;
    if (i.closed) { const [, cls] = verdict(i.score.total); side = `<span class="score-pill ${cls}">${i.score.total}</span>`; }
    else side = `<span data-since="${i.createdAt}">${fmtDur(elapsed - i.createdAt)}</span>`;
    const counts = {};
    if (!i.closed) for (const r of i.units) { const u = UNIT[r.uid]; if (u.inter === i.id) counts[u.status] = (counts[u.status] || 0) + 1; }
    const chips = Object.entries(counts).map(([s, n]) => `<span class="chip">${n} ${STATUS_LABEL[s].toLowerCase()}</span>`).join("");
    const reqOpen = !i.closed && openRequests(i).length ? `<span class="chip" style="color:var(--warn);border-color:var(--warn)">renfort demandé</span>` : "";
    return `<button class="row${sel}" type="button" data-select="inter" data-id="${i.id}">
      <span class="badge ${numClass(i.received, i.loc.zone)}">#${i.num}</span>
      <span class="mid"><span class="t1">${esc(label)}</span><span class="t2">${esc(i.loc.address)}</span></span>
      <span class="side">${side}</span>
      ${chips || reqOpen ? `<span class="chips">${reqOpen}${chips}</span>` : ""}</button>`;
  };
  il.innerHTML = (active.length || closed.length)
    ? active.map(rowFor).join("") + (closed.length ? `<div class="sec-title" style="border-top:1px solid var(--line)">Clôturées</div>` + closed.map(rowFor).join("") : "")
    : `<div class="empty">Aucune intervention.</div>`;
}

function renderRadio() {
  $("#radio-count").textContent = radio.length;
  const last = renderRadio.lastId || 0;
  $("#radio").innerHTML = radio.length ? radio.map(m => `<li class="${m.id > last ? "fresh" : ""}"><span class="tm">${fmtClock(m.t)}</span>
    <span class="src ${m.svc}">${m.svc === "sys" ? "SALLE" : ({ s18: "18", s15: "15", s17: "17", s17g: "17" }[m.svc] || "")}</span>
    <span>${esc(m.text)}</span></li>`).join("") : `<li><span></span><span></span><span style="color:var(--muted)">Le trafic radio s'affichera ici.</span></li>`;
  renderRadio.lastId = radio.length ? radio[0].id : 0;
}

function svcBlock(obj) {
  return `<div class="svc-row">${["18", "15", "17"].map(v => {
    const open = obj.open.has(v);
    const color = v === "17" ? "n17" : "n" + v;
    return `<div class="svc ${open ? "open" : ""}">
      <span class="lab">${v === "17" ? pic("s17", "sm") + pic("s17g", "sm") : pic("s" + v, "sm")}<span class="badge ${color}" style="min-width:28px;height:20px;font-size:12px">${v}</span></span>
      ${open ? `<span class="state">En ligne</span>` : `<button class="btn small" type="button" data-ic="${v}">Interconnecter</button>`}
    </div>`;
  }).join("")}</div>`;
}

function unitList(obj, loc) {
  const groups = [
    ["18", "Pompiers", u => TYPES[u.type].svc === "18"],
    ["15", "SAMU", u => TYPES[u.type].svc === "15"],
    ["17P", "Police nationale", u => TYPES[u.type].force === "P"],
    ["17G", "Gendarmerie", u => TYPES[u.type].force === "G"],
  ];
  return `<div class="units">${groups.map(([key, name, f]) => {
    const svc = key.slice(0, 2);
    const locked = !obj.open.has(svc);
    const all = UNITS.filter(f).map(u => ({ u, eta: loc && u.status === "dispo" ? etaFor(u, loc) : Infinity }))
      .sort((a, b) => (a.u.status === "dispo" ? 0 : 1) - (b.u.status === "dispo" ? 0 : 1) || a.eta - b.eta);
    // Par défaut : les 5 moyens disponibles les plus proches, plus ceux déjà cochés
    const us = obj.showAll ? all : all.filter((x, k) => (x.u.status === "dispo" && k < 5) || obj.sel.has(x.u.id));
    const pkey = key === "17G" ? "s17g" : key === "17P" ? "s17" : `s${svc}`;
    const zoneNote = loc && svc === "17" && ((key === "17P") !== (loc.zone === "P")) ? " · hors zone" : "";
    return `<div class="ugroup"><div class="gh">${pic(pkey, "sm")}${name}
      <span class="lock">${locked ? "· interconnexion requise" : ""}${zoneNote}</span></div>
      ${us.map(({ u, eta }) => {
        const off = u.status !== "dispo";
        const checked = obj.sel.has(u.id) ? "checked" : "";
        const right = off ? STATUS_LABEL[u.status] : (loc ? fmtMin(eta) : "");
        return `<label class="unit ${off ? "off" : ""}"><input type="checkbox" id="cb-${u.id}" data-uid="${u.id}" ${checked} ${off ? "disabled" : ""}>
          ${pic(pkey, "xs")}
          <span class="nm">${esc(u.label)}<small>${esc(TYPES[u.type].long)}</small></span>
          <span class="eta">${right}</span></label>`;
      }).join("")}</div>`;
  }).join("")}
  <button class="btn small" type="button" data-act="showall">${obj.showAll ? "N'afficher que les plus proches" : `Afficher les ${UNITS.length} moyens du secteur`}</button></div>`;
}

function engageHint(obj, needAddress) {
  if (needAddress) return ["Obtenez d'abord l'adresse de l'intervention.", true];
  if (!obj.sel.size) return ["Cochez des moyens, ou proposez le départ type de la nature choisie.", false];
  const locked = new Set([...obj.sel].map(id => TYPES[UNIT[id].type].svc).filter(v => !obj.open.has(v)));
  if (locked.size) return [`Interconnectez avec le ${[...locked].join(" et le ")} pour engager ces moyens.`, true];
  return ["", false];
}

/* Demandes de renfort encore ouvertes : après la première arrivée, toute case attendue non couverte */
function openRequests(i) {
  if (i.firstArrivalAt === null) return [];
  const slots = slotsOf(i.sc);
  const { res } = matchSlots(slots, recsOf(i), i.loc.zone);
  return slots.filter((_, k) => !res[k]);
}

function renderInterPane(i) {
  const head = `<div class="pane-head"><span class="badge ${numClass(i.received, i.loc.zone)}">#${i.num}</span>
    <div><div class="eyebrow">Intervention · appel ${i.received}</div><div class="pane-title">${i.nature ? esc(NATURE[i.nature].label) : "Nature non qualifiée"}</div></div>

    <div class="block"><div class="addr">${esc(i.loc.address)}<span class="zone">${i.loc.zone === "P" ? "zone police" : "zone gendarmerie"}</span></div></div>`;

  const unitsRows = i.units.length ? i.units.map(r => {
    const u = UNIT[r.uid];

    return `<div class="unit" style="cursor:default"><span></span>${pic(unitSvcClass(u), "xs")}
      <span class="nm">${esc(u.label)}${r.late ? "<small>renfort</small>" : ""}</span>
      <span class="status st-${st}"${eta}>${etaText(u, st)}</span></div>`;
  }).join("") : `<p class="hint">Aucun moyen engagé.</p>`;

    const s = i.score, [vtxt, vcls] = verdict(s.total);
    return head + `<div class="block"><h3>Moyens engagés</h3><div class="units">${unitsRows}</div></div>
      <div class="block scorecard"><h3>Débriefing</h3>

        <div class="bars">${s.parts.map(([n, v, w]) => `<div class="bar"><span>${n}</span><span class="track"><span class="fill" style="width:${Math.round(v * 100)}%;display:block"></span></span><span class="pts">${Math.round(v * w)}/${w}</span></div>`).join("")}</div>

  const reqs = openRequests(i);

      ${reqs.map(r => `<span>${esc(r.s.map(t => SLOT_LABEL[t]).join(" ou "))}</span>`).join("")}</div></div>` : "")
    + `<div class="block"><h3>Moyens engagés</h3><div class="units">${unitsRows}</div></div>
    <div class="block"><h3>Services</h3>${svcBlock(i)}</div>
    <div class="block"><h3>Ajouter des moyens</h3>${unitList(i, i.loc)}</div>
    <div class="actions"><div class="inline">
      <button class="btn primary" type="button" data-act="reinforce" ${i.sel.size && !hintWarn ? "" : "disabled"}>Engager en renfort</button>
      <button class="btn" type="button" data-act="close">Clôturer et rappeler les moyens</button></div>
      ${i.sel.size && hint ? `<p class="hint ${hintWarn ? "warn" : ""}">${esc(hint)}</p>` : ""}

}

function renderRight() {
  const pane = $("#pane");
  const prevScroll = pane.parentElement.scrollTop;
  let html;
  if (selected && selected.kind === "call") { const c = calls.find(x => x.id === selected.id); html = c ? renderCallPane(c) : renderIdle(); if (!c) selected = null; }
  else if (selected && selected.kind === "inter") { const i = interById(selected.id); html = i ? renderInterPane(i) : renderIdle(); }
  else html = renderIdle();
  pane.innerHTML = html;
  pane.parentElement.scrollTop = prevScroll;
  const tr = $("#transcript");
  if (tr) tr.scrollTop = tr.scrollHeight;
}

function etaText(u, st) {
  if (st === "parti" && u.path) return `${STATUS_LABEL.parti} · ${fmtMin(pathRemaining(u) / u.speedNow)}`;
  return STATUS_LABEL[st];
}
function pathRemaining(u) {
  let d = 0, p = { x: u.x, y: u.y };
  for (let k = u.pi + 1; k < u.path.length; k++) { d += dist(p, u.path[k]); p = u.path[k]; }
  return d;
}

/* --- Événements --- */
function currentObj() {
  if (!selected) return null;
  return selected.kind === "call" ? calls.find(c => c.id === selected.id) : interById(selected.id);
}
document.addEventListener("click", e => {
  const sel = e.target.closest("[data-select]");
  if (sel) {
    selected = { kind: sel.dataset.select, id: sel.dataset.id };
    if (selected.kind === "call") { const c = calls.find(x => x.id === selected.id); if (c && !c.answered && started && !paused) answer(c); }
    dirty.left = dirty.right = true; return;
  }
  const obj = currentObj();
  const q = e.target.closest("[data-q]");
  if (q && obj && selected.kind === "call") { ask(obj, q.dataset.q); return; }
  const ic = e.target.closest("[data-ic]");
  if (ic && obj) { interconnect(obj, ic.dataset.ic); return; }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;
  if (a === "start") return startShift();
  if (!obj) return;
  if (a === "showall") { obj.showAll = !obj.showAll; dirty.right = true; }
  else if (a === "answer") answer(obj);
  else if (a === "propose") { obj.hint = propose(obj, obj.loc, obj.nature); dirty.right = true; }
  else if (a === "engage") engageCall(obj);
  else if (a === "nothing") { obj.sel.clear(); engageCall(obj); }
  else if (a === "reinforce") engage(obj, [...obj.sel]);
  else if (a === "close") forceClose(obj);
});
document.addEventListener("change", e => {
  const obj = currentObj();
  if (!obj) return;
  if (e.target.matches("[data-uid]")) {
    const id = e.target.dataset.uid;
    if (e.target.checked) obj.sel.add(id); else obj.sel.delete(id);
    dirty.right = true;
  } else if (e.target.matches("[data-nature]")) {
    obj.nature = e.target.value; obj.hint = ""; dirty.right = dirty.left = true;
  }
});

function startShift() {
  started = true; paused = false; nextSpawn = elapsed + 12;
  $("#btn-pause").textContent = "Pause";
  say("sys", "Prise de garde. Tous les moyens sont disponibles.");
  dirty.left = dirty.right = true;
}
$("#btn-pause").addEventListener("click", () => {
  if (!started) return startShift();
  paused = !paused;
  $("#btn-pause").textContent = paused ? "Reprendre" : "Pause";
});
$("#btn-speed").addEventListener("click", () => {
  speed = speed === 1 ? 2 : speed === 2 ? 4 : 1;
  $("#btn-speed").textContent = `Vitesse ×${speed}`;
});
$("#btn-sound").addEventListener("click", () => {
  soundOn = !soundOn;
  $("#btn-sound").setAttribute("aria-pressed", String(soundOn));
  if (soundOn) beep();
});

/* Sonnerie : deux bips, uniquement si le son est activé */
let audio = null;
function beep() {
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audio.currentTime;
    [0, 0.22].forEach(off => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; o.type = "sine";
      g.gain.setValueAtTime(0.0001, t0 + off);
      g.gain.exponentialRampToValueAtTime(0.15, t0 + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.16);
      o.connect(g).connect(audio.destination);
      o.start(t0 + off); o.stop(t0 + off + 0.18);
    });
  } catch (err) { /* son indisponible */ }
}

/* Éléments dynamiques : véhicules, trajets, appels, interventions */
const vehMarkers = {}, pathLines = {}, incMarkers = {}, callMarkers = {};
function syncMap(now) {
  for (const u of UNITS) {
    const moving = u.status === "parti" || u.status === "transport" || u.status === "retour";
    if (u.status === "dispo") {
      if (vehMarkers[u.id]) { vehMarkers[u.id].remove(); delete vehMarkers[u.id]; }
    } else {
      const key = unitSvcClass(u);
      if (!vehMarkers[u.id]) {
        vehMarkers[u.id] = L.marker(toLL(u), { keyboard: false, zIndexOffset: 500,
          icon: L.divIcon({ className: "mk", html: `<span class="veh"><span class="pic rd ${key}">${picto(key)}</span><span class="vlab">${esc(u.label)}</span></span>`, iconSize: [20, 20], iconAnchor: [10, 10] }) })
          .on("click", () => { if (u.inter) { selected = { kind: "inter", id: u.inter }; dirty.left = dirty.right = true; } })
          .addTo(map);
      }
      vehMarkers[u.id].setLatLng(toLL(u));
      const el = vehMarkers[u.id].getElement();
      if (el) el.classList.toggle("moving", moving);
    }
    const showPath = u.path && (u.status === "parti" || u.status === "transport");
    if (showPath) {
      const lls = [toLL(u), ...u.path.slice(u.pi + 1).map(toLL)];
      if (!pathLines[u.id]) pathLines[u.id] = L.polyline(lls, { pane: "paths", interactive: false, weight: 2, dashArray: "3 5", opacity: 0.8, color: colors[unitSvcClass(u)] }).addTo(map);
      else pathLines[u.id].setLatLngs(lls);
    } else if (pathLines[u.id]) { pathLines[u.id].remove(); delete pathLines[u.id]; }
  }
  // interventions en cours
  const live = new Set();
  for (const i of inters) {
    if (i.closed) continue;
    live.add(i.id);
    const state = `${i.firstArrivalAt !== null ? "on" : "go"}${selected && selected.id === i.id ? " sel" : ""}`;
    let m = incMarkers[i.id];
    if (!m) {
      m = incMarkers[i.id] = L.marker(toLL(i.loc), { zIndexOffset: 1000, keyboard: false, icon: L.divIcon({ className: "mk", html: "", iconSize: [26, 26] }) })
        .on("click", () => { selected = { kind: "inter", id: i.id }; dirty.left = dirty.right = true; }).addTo(map);
      m.bindTooltip(esc(i.loc.address), { direction: "top", offset: [0, -14] });
    }
    if (m._state !== state) { m.setIcon(L.divIcon({ className: "mk", html: `<span class="inc ${state}"><b>${i.num}</b></span>`, iconSize: [26, 26], iconAnchor: [13, 13] })); m._state = state; }
  }
  for (const id in incMarkers) if (!live.has(id)) { incMarkers[id].remove(); delete incMarkers[id]; }
  // appels localisés, pas encore engagés
  const liveCalls = new Set();
  for (const c of calls) {
    if (!c.addressKnown) continue;
    liveCalls.add(c.id);
    if (!callMarkers[c.id]) {
      callMarkers[c.id] = L.marker(toLL(c.loc), { zIndexOffset: 900, keyboard: false,
        icon: L.divIcon({ className: "mk", html: `<span class="callmk">?</span>`, iconSize: [26, 26], iconAnchor: [13, 13] }) })
        .on("click", () => { selected = { kind: "call", id: c.id }; dirty.left = dirty.right = true; }).addTo(map);
      if (selected && selected.id === c.id) map.panInside(toLL(c.loc), { padding: [60, 60] });
    }
  }
  for (const id in callMarkers) if (!liveCalls.has(id)) { callMarkers[id].remove(); delete callMarkers[id]; }
}
new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById("map"));

/* =========================================================
   10. Boucle principale
   ========================================================= */
let last = performance.now(), tickAcc = 0, pointerDown = false;
document.addEventListener("pointerdown", () => { pointerDown = true; });
document.addEventListener("pointerup", () => { pointerDown = false; });
document.addEventListener("pointercancel", () => { pointerDown = false; });
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (started && !paused) update(dt * SCALE * speed);
  tickAcc += dt;
  if (tickAcc > 0.25) {
    tickAcc = 0;
    renderHead();
    document.querySelectorAll("[data-since]").forEach(el => { el.textContent = fmtDur(elapsed - Number(el.dataset.since)); });
    document.querySelectorAll("[data-eta]").forEach(el => { const u = UNIT[el.dataset.eta]; if (u) el.textContent = etaText(u, u.status); });
  }
  if (!pointerDown) {
    if (dirty.left) { renderLeft(); dirty.left = false; }
    if (dirty.right) { renderRight(); dirty.right = false; }
  }
  if (dirty.radio) { renderRadio(); dirty.radio = false; }
  syncMap(now);
  requestAnimationFrame(frame);
}
$("#legend").innerHTML = [["s18", "Pompiers 18"], ["s15", "SAMU 15"], ["s17", "Police 17"], ["s17g", "Gendarmerie 17"]]
  .map(([k, t]) => `<span>${pic(k, "sm")}${t}</span>`).join("") + `<span><i class="sw zone"></i>Zone police</span>`;
renderHead(); renderLeft(); renderRight(); renderRadio();
requestAnimationFrame(frame);
})();
</script>
