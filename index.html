<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14202e">
<title>Le petit train de Boubou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14202e;--panel:#1b2a3a;--line:#2c3e52;--text:#f3f6f9;--accent:#f0a020}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Barlow,system-ui,sans-serif;overscroll-behavior:none}
body{touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* ===== MENU ===== */
#menu{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(#2a6fb0,#14202e 420px)}
.mwrap{max-width:1100px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px 120px}
.title{text-align:center;margin:6px 0 18px}
.title h1{margin:0;font:700 clamp(32px,7vw,58px)/1 'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.step{display:flex;align-items:center;gap:10px;margin:18px 4px 10px;font:700 24px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.5px}
.step b{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#111;font-size:22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.grid3{grid-template-columns:1fr}}
.card{background:#fff;color:#1b2a3a;border:5px solid transparent;border-radius:22px;padding:8px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .1s}
.card:active{transform:scale(.97)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 4px rgba(240,160,32,.45),0 6px 0 rgba(0,0,0,.25)}
.rcard canvas{width:100%;height:110px;display:block;border-radius:14px;background:linear-gradient(#bfe2f7,#eaf6fd)}
.rname{font:700 30px 'Barlow Condensed',sans-serif;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.ri{font-size:32px}
.rstops{font-size:20px;letter-spacing:2px;margin:2px 0 4px;opacity:.85}
.locos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lcard canvas{width:100%;height:84px;display:block;border-radius:12px;background:linear-gradient(#bfe2f7,#eaf6fd)}
.lname{font:700 20px 'Barlow Condensed',sans-serif;margin-top:4px}
#colors{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.sw{width:58px;height:58px;border-radius:50%;border:5px solid #fff;padding:0;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.sw.sel{outline:5px solid var(--accent);outline-offset:2px}
.startbar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(20,32,46,0),rgba(20,32,46,.95) 30%);display:flex;justify-content:center}
.go{background:#2bb24c;color:#fff;border:none;border-radius:20px;padding:16px 40px;font:700 30px 'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;box-shadow:0 6px 0 #1a7a32;min-width:min(420px,100%)}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #1a7a32}

/* ===== GAME ===== */
#game{position:fixed;inset:0;display:grid;background:var(--bg);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  grid-template-areas:"stage stage" "l r";grid-template-columns:2fr 1fr;grid-template-rows:1fr auto;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#stage{grid-area:stage;position:relative;min-height:0;min-width:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ctlL{grid-area:l}#ctlR{grid-area:r}
.ctlgrp{display:grid;gap:10px;padding:10px;background:var(--panel)}
#ctlL{grid-template-columns:1fr 1fr 1fr}
#ctlR{grid-template-columns:1fr 1.4fr}
.ctl{position:relative;min-height:84px;border:none;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;
  touch-action:none;font:700 16px 'Barlow Condensed',sans-serif;letter-spacing:.5px;text-transform:uppercase;color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);transition:transform .05s,filter .1s}
.ctl svg{width:40px;height:40px;flex:none}
.ctl.down{transform:scale(.95);filter:brightness(1.25)}
.ctl:disabled{filter:grayscale(1) brightness(.6)}
#bFwd{background:#2bb24c}#bBack{background:#2f78c8}#bBrake{background:#d23a30}#bHorn{background:#e5a21a}#bAct{background:#8a55d6}
.ctl.ready{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,210,63,.95),inset 0 -6px 0 rgba(0,0,0,.25);transform:scale(1)}50%{box-shadow:0 0 0 8px rgba(255,210,63,.3),inset 0 -6px 0 rgba(0,0,0,.25);transform:scale(1.05)}}
#top{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:8px;align-items:center;pointer-events:none}
.chip{background:rgba(20,32,46,.8);border-radius:14px;padding:4px 12px;font:700 22px 'Barlow Condensed',sans-serif;white-space:nowrap}
#prog{position:relative;flex:1;height:40px;background:rgba(20,32,46,.55);border-radius:14px;min-width:0}
#progLine{position:absolute;left:14px;right:14px;top:19px;height:4px;background:rgba(255,255,255,.35);border-radius:3px}
#progIn{position:absolute;left:20px;right:20px;top:0;bottom:0}
.pS{position:absolute;top:6px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:16px;border:3px solid #fff}
.pS.done{background:#b7f0c3;border-color:#2bb24c}
.pS.nx{border-color:var(--accent);animation:pulse 1s infinite}
#pT{position:absolute;top:2px;font-size:24px;margin-left:-12px;transform:scaleX(-1);filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.ib{pointer-events:auto;width:42px;height:40px;border-radius:12px;border:none;background:rgba(20,32,46,.8);display:grid;place-items:center;padding:0;font-size:20px}
.ib.off{opacity:.45}
#hint{position:absolute;left:50%;top:58px;transform:translateX(-50%);background:#fff;color:#1b2a3a;border:4px solid var(--accent);padding:6px 18px;border-radius:18px;
  font:700 clamp(18px,2.6vw,26px) 'Barlow Condensed',sans-serif;max-width:94%;text-align:center;pointer-events:none;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#hint:empty{display:none}
#toast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,10px);background:#2bb24c;color:#fff;padding:8px 22px;border-radius:16px;font:700 24px 'Barlow Condensed',sans-serif;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (orientation:portrait){
  #game{grid-template-areas:"stage" "l" "r";grid-template-columns:1fr;grid-template-rows:min(112vw,62dvh) minmax(90px,1fr) minmax(90px,1fr)}
  #ctlR{padding-top:0}
  .ctl{min-height:0;height:100%;font-size:18px}
  .ctl svg{width:48px;height:48px}
  #top{flex-wrap:wrap}
  #prog{order:5;flex-basis:100%;height:38px}
  .chip{margin-right:auto}
  #hint{top:100px;font-size:20px}
}
@media (orientation:landscape) and (max-height:540px){
  #game{grid-template-areas:"l stage r";grid-template-columns:clamp(150px,22vw,210px) 1fr clamp(110px,16vw,160px);grid-template-rows:1fr}
  .ctlgrp{padding:8px 6px;gap:8px}
  #ctlL{grid-template-columns:1fr 1fr;grid-template-rows:2fr 1fr}
  #ctlL #bBrake{grid-column:span 2;order:3}
  #ctlR{grid-template-columns:1fr;grid-template-rows:1fr 1.5fr}
  .ctl{min-height:0}
  #hint{top:54px;font-size:18px}
  .chip{font-size:18px}
}

/* ===== END ===== */
#endOv{position:fixed;inset:0;background:rgba(10,16,24,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.ecard{background:#fff;color:#1b2a3a;border-radius:26px;padding:24px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.ecard h2{margin:0;font:700 48px 'Barlow Condensed',sans-serif;text-transform:uppercase}
#eRoute{font:700 26px 'Barlow Condensed',sans-serif;margin:4px 0}
#eStars{font:700 56px 'Barlow Condensed',sans-serif;margin:6px 0 16px}
.ebtns{display:flex;flex-direction:column;gap:12px}
.ebtns .go{min-width:0;width:100%;font-size:26px;padding:12px}
.go.blue{background:#2f78c8;box-shadow:0 6px 0 #1d4f87}
</style>
</head>
<body>
<section id="menu">
 <div class="mwrap">
  <div class="title"><h1>🚂 Le petit train de Boubou</h1></div>
  <div class="step"><b>1</b>Quel voyage ?</div>
  <div class="grid3" id="routes"></div>
  <div class="step"><b>2</b>Quelle locomotive ?</div>
  <div class="locos" id="locos"></div>
  <div class="step"><b>3</b>Quelle couleur ?</div>
  <div id="colors"></div>
 </div>
 <div class="startbar"><button class="go" id="startBtn">C’est parti ! ▶</button></div>
</section>

<section id="game" class="hidden">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="top">
      <div class="chip">⭐ <span id="hStars">0</span></div>
      <div id="prog"><div id="progLine"></div><div id="progIn"><div id="pT">🚂</div></div></div>
      <button class="ib" id="voiceBtn" title="Voix">🗣️</button>
      <button class="ib" id="sndBtn" title="Son">🔊</button>
      <button class="ib" id="menuBtn" title="Menu">🏠</button>
    </div>
    <div id="hint"></div>
    <div id="toast"></div>
  </div>
  <div id="ctlL" class="ctlgrp">
    <button class="ctl" id="bBack"><svg viewBox="0 0 32 32" fill="#fff"><path d="M21 5 7 16l14 11z"/></svg>Reculer</button>
    <button class="ctl" id="bBrake"><svg viewBox="0 0 32 32" fill="#fff"><rect x="8" y="8" width="16" height="16" rx="3"/></svg>Stop</button>
    <button class="ctl" id="bFwd"><svg viewBox="0 0 32 32" fill="#fff"><path d="M11 5l14 11-14 11z"/></svg>Avancer</button>
  </div>
  <div id="ctlR" class="ctlgrp">
    <button class="ctl" id="bHorn"><svg viewBox="0 0 32 32" fill="#fff"><path d="M4 13h5l14-7v20L9 19H4z"/><path d="M26 11v10" stroke="#fff" stroke-width="2.6"/></svg>Klaxon</button>
    <button class="ctl" id="bAct" disabled><span id="actIcon"></span><span id="actLbl">Action</span></button>
  </div>
</section>

<div id="endOv" class="hidden"><div class="ecard">
  <h2>🎉 Bravo !</h2><div id="eRoute"></div><div id="eStars"></div>
  <div class="ebtns"><button class="go" id="againBtn">Rejouer 🔁</button><button class="go blue" id="backBtn">Autre voyage 🚂</button></div>
</div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
/* ====================== helpers ====================== */
function toRgb(c){ if(c.startsWith('rgb')) return c.match(/\d+/g).slice(0,3).map(Number);
  let h=c.replace('#',''); if(h.length===3) h=h.split('').map(x=>x+x).join(''); const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function mix(a,b,t){const A=toRgb(a),B=toRgb(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')';}
const light=(c,t)=>mix(c,'#ffffff',t), dark=(c,t)=>mix(c,'#000000',t);
function rr(c,x,y,w,h,r){c.beginPath(); if(c.roundRect) c.roundRect(x,y,w,h,r); else c.rect(x,y,w,h);}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2);}
function line(c,x1,y1,x2,y2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
function approach(v,t,d){return v<t?Math.min(t,v+d):Math.max(t,v-d);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const meters=px=>Math.max(1,Math.round(Math.abs(px)/2));
function vib(ms=12){ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(e){} }
function bodyGrad(c,y0,y1,col){const g=c.createLinearGradient(0,y0,0,y1); g.addColorStop(0,light(col,.2)); g.addColorStop(.45,col); g.addColorStop(1,dark(col,.32)); return g;}
function glassGrad(c,y0,y1){const g=c.createLinearGradient(0,y0,0,y1); g.addColorStop(0,'#6e8597'); g.addColorStop(1,'#1c2733'); return g;}
function cabWin(c,x,y,w,h,r,sx){ c.fillStyle=glassGrad(c,y,y+h); rr(c,x,y,w,h,r); c.fill();
  if(sx!==undefined){ c.save(); rr(c,x,y,w,h,r); c.clip(); c.fillStyle='rgba(8,11,16,.85)'; circ(c,sx,y+h*.45,4.4); c.fill(); rr(c,sx-7,y+h*.45+4,14,12,4); c.fill(); c.restore(); }
  c.strokeStyle='rgba(255,255,255,.18)'; c.lineWidth=1; line(c,x+2,y+h-3,x+w*.6,y+2); }
function plate(c,x,y,txt){ c.font='600 7px "Barlow Condensed",sans-serif'; const w=c.measureText(txt).width+6; c.fillStyle='#16181c'; c.fillRect(x-w/2,y-7,w,9); c.fillStyle='#d9c27a'; c.textAlign='center'; c.fillText(txt,x,y); }

/* ====================== vehicles ====================== */
function wheel(c,x,y,r,a,rim){
  c.fillStyle='#202226'; circ(c,x,y,r); c.fill();
  c.fillStyle=rim||'#3a3e45'; circ(c,x,y,r*.8); c.fill();
  c.strokeStyle='#202226'; c.lineWidth=Math.max(1.4,r*.12); const n=r>11?10:6;
  for(let i=0;i<n;i++){const an=a+i*Math.PI*2/n; line(c,x,y,x+Math.cos(an)*r*.8,y+Math.sin(an)*r*.8);}
  c.fillStyle='#9aa0a8'; circ(c,x,y,r*.22); c.fill();
  c.strokeStyle='rgba(255,255,255,.14)'; c.lineWidth=1; c.beginPath(); c.arc(x,y,r-1,Math.PI*1.1,Math.PI*1.6); c.stroke();
}
function bogie(c,x1,x2,a){ c.fillStyle='#2b2e33'; rr(c,x1-12,-24,x2-x1+24,10,2); c.fill(); c.fillStyle='#3a3e45'; c.fillRect((x1+x2)/2-5,-24,10,12); wheel(c,x1,-9,9,a); wheel(c,x2,-9,9,a); }
function buffers(c,x0,x1){ c.fillStyle='#1c1e22'; c.fillRect(x0-5,-26,5,5); c.fillRect(x1,-26,5,5); }
function panto(c,x,roof){ const top=-128, mid=(roof+top)/2; c.strokeStyle='#26282d'; c.lineWidth=2; c.lineCap='round';
  c.beginPath(); c.moveTo(x-14,roof); c.lineTo(x+8,mid); c.lineTo(x-4,top+3); c.stroke(); c.lineWidth=2.6; line(c,x-18,top,x+12,top);
  c.fillStyle='#8a8f99'; c.fillRect(x-18,roof-4,8,4); c.fillRect(x+2,roof-4,8,4); }

function drawSteam(c,col,s){
  const a=s.wheel, blk='#1b1d21';
  c.fillStyle=blk; c.fillRect(4,-27,142,8); c.fillStyle='#7d1f1f'; c.fillRect(144,-29,6,11);
  c.fillStyle=bodyGrad(c,-68,-26,col); rr(c,48,-68,82,42,9); c.fill();
  c.fillStyle='#aeb3ba'; [70,94,116].forEach(x=>c.fillRect(x,-68,2,42));
  c.fillStyle=blk; rr(c,126,-70,20,46,4); c.fill(); c.fillStyle='#2b2e33'; circ(c,136,-47,7); c.fill();
  c.fillStyle=blk; c.fillRect(124,-92,12,24); c.fillRect(121,-96,18,5);
  c.fillStyle=bodyGrad(c,-80,-66,col); c.beginPath(); c.ellipse(92,-68,10,9,0,Math.PI,0); c.fill(); c.beginPath(); c.ellipse(76,-68,6,6,0,Math.PI,0); c.fill();
  c.fillStyle='#b89a4e'; c.fillRect(59,-77,3,9);
  c.fillStyle='#e6dfc4'; rr(c,139,-85,8,8,2); c.fill();
  c.fillStyle=blk; c.fillRect(46,-30,98,4);
  c.fillStyle=bodyGrad(c,-98,-24,col); rr(c,6,-98,46,74,3); c.fill();
  c.fillStyle='#2a2d33'; rr(c,2,-103,54,7,3); c.fill();
  cabWin(c,16,-88,22,20,2,27); plate(c,29,-45,'BB 231');
  c.fillStyle='#2b2e33'; rr(c,118,-40,26,12,3); c.fill();
  wheel(c,22,-10,10,a*1.6); wheel(c,141,-9,9,a*1.8);
  [60,88,116].forEach(x=>wheel(c,x,-16,16,a,dark(col,.25)));
  const px=Math.cos(a)*7, py=Math.sin(a)*7;
  c.strokeStyle='#c5c9cf'; c.lineWidth=3.2; c.lineCap='round'; line(c,60+px,-16+py,116+px,-16+py);
  c.strokeStyle='#9da2aa'; c.lineWidth=2.4; line(c,116+px,-16+py,132,-34);
}
function drawWestern(c,col,s){
  const a=s.wheel*.9, blk='#1b1d21';
  c.fillStyle=blk; c.fillRect(4,-27,134,8);
  c.fillStyle='#6f737b'; c.beginPath(); c.moveTo(134,-26); c.lineTo(158,-1); c.lineTo(134,-1); c.closePath(); c.fill();
  c.strokeStyle='#4b4f56'; c.lineWidth=1.3; for(let i=0;i<5;i++) line(c,137+i*4,-23+i*4.5,137+i*4,-1);
  c.fillStyle=bodyGrad(c,-66,-26,col); rr(c,46,-66,84,40,8); c.fill();
  c.fillStyle='#a88a3d'; [68,92,114].forEach(x=>c.fillRect(x,-66,2,40));
  c.fillStyle=blk; rr(c,126,-68,14,44,4); c.fill();
  c.beginPath(); c.moveTo(122,-66); c.lineTo(114,-102); c.lineTo(142,-102); c.lineTo(134,-66); c.closePath(); c.fill();
  c.fillStyle='#33363c'; c.fillRect(112,-106,32,5);
  c.fillStyle='#8a7a4a'; rr(c,128,-88,16,14,2); c.fill(); c.fillStyle='#efe6c2'; circ(c,142,-81,4); c.fill();
  c.fillStyle='#a88a3d'; c.beginPath(); c.moveTo(97,-66); c.lineTo(99,-79); c.lineTo(106,-79); c.lineTo(108,-66); c.fill();
  c.fillStyle=bodyGrad(c,-76,-66,col); c.beginPath(); c.ellipse(78,-66,9,8,0,Math.PI,0); c.fill();
  c.fillStyle=bodyGrad(c,-100,-24,dark(col,.12)); rr(c,6,-100,42,76,3); c.fill();
  c.fillStyle='#3b2a22'; rr(c,0,-106,54,8,4); c.fill();
  cabWin(c,14,-90,24,20,2,26); plate(c,27,-46,'N° 12');
  wheel(c,22,-10,10,a*1.8); wheel(c,121,-9,9,a*2);
  [58,94].forEach(x=>wheel(c,x,-18,18,a,dark(col,.2)));
  const px=Math.cos(a)*8, py=Math.sin(a)*8; c.strokeStyle='#c5c9cf'; c.lineWidth=3.2; c.lineCap='round'; line(c,58+px,-18+py,94+px,-18+py);
}
function drawDiesel(c,col,s){
  const a=s.wheel*1.7;
  c.fillStyle='#202226'; c.fillRect(4,-28,144,6);
  c.fillStyle=bodyGrad(c,-86,-26,col); c.beginPath(); c.moveTo(6,-26); c.lineTo(6,-80); c.quadraticCurveTo(6,-86,12,-86); c.lineTo(122,-86);
  c.quadraticCurveTo(131,-86,135,-79); c.lineTo(148,-56); c.lineTo(148,-26); c.closePath(); c.fill();
  c.fillStyle='#5c6069'; c.fillRect(14,-86,106,4);
  c.fillStyle='rgba(235,235,230,.9)'; c.fillRect(6,-47,142,4); c.fillStyle=dark(col,.35); c.fillRect(6,-43,142,2);
  c.fillStyle=glassGrad(c,-80,-60); c.beginPath(); c.moveTo(122,-80); c.lineTo(133,-80); c.lineTo(143,-61); c.lineTo(122,-61); c.closePath(); c.fill();
  c.save(); c.clip(); c.fillStyle='rgba(8,11,16,.85)'; circ(c,129,-71,4.4); c.fill(); c.restore();
  cabWin(c,12,-79,16,14,2);
  c.strokeStyle=dark(col,.4); c.lineWidth=1.2; rr(c,34,-76,13,44,2); c.stroke();
  c.fillStyle=dark(col,.18); rr(c,56,-79,56,22,2); c.fill(); c.strokeStyle=dark(col,.45); for(let x=59;x<111;x+=4) line(c,x,-77,x,-59);
  c.fillStyle='#2b2e33'; c.fillRect(84,-91,10,5);

const G={active:false};

let STOPS=[],WORLD=30000,TL=0,HS=null,TREES=[],FG=[],CLOUDS=[],ZONES=[];
function H(x){ if(x<=0) return HS[0]; const i=x/10, i0=Math.floor(i); if(i0>=HS.length-1) return HS[HS.length-1]; const f=i-i0; return HS[i0]*(1-f)+HS[i0+1]*f; }
function dH(x){ return (H(x+8)-H(x-8))/16; }
function railY(x){ return RAIL-H(x); }
function zoneAt(x){ let z='grass'; for(const [a,t] of ZONES) if(x>=a) z=t; return z; }
const SKINS=['#e8bfa0','#c68863','#8d5524','#f1d3bd','#d9a066'], HAIRS=['#2b2018','#121212','#8a6a3a','#5a2e18','#6d6d6d','#c9a063'];
const COATS=['#3d6aa8','#a83d3d','#3da85a','#c98a2b','#7a4fa8','#2b8a8a','#d0603a','#566070'];


function buildWorld(R){
  WORLD=R.world; ZONES=R.zones; const rng=mulberry32(R.seed*7919);
  STOPS=R.stops.map(s=>Object.assign({},s));
  // terrain
  const lv=STOPS.map((s,i)=>i===0?0:Math.round((rng()*1.6-.5)*110));
  const gaps=[]; for(let i=0;i<STOPS.length-1;i++){ const a=STOPS[i].x+FLAT, b=STOPS[i+1].x-FLAT, len=b-a, k=Math.max(1,Math.round(len/2300));
    const sign=rng()<.72?1:-1, Bmax=.2*len/(Math.PI*k); gaps.push({a,b,len,k,L0:lv[i],L1:lv[i+1],B:sign*Math.min(Bmax,110+rng()*140)}); }
  HS=new Float32Array(Math.ceil(WORLD/10)+3);
  for(let j=0;j<HS.length;j++){ const x=j*10; let h=lv[0];
    if(x>=STOPS[STOPS.length-1].x-FLAT) h=lv[lv.length-1];
    else for(let i=0;i<STOPS.length;i++){ if(Math.abs(x-STOPS[i].x)<=FLAT){ h=lv[i]; break; }
      const g=gaps[i]; if(g&&x>g.a&&x<g.b){ const t=(x-g.a)/g.len, sm=t*t*(3-2*t); h=g.L0+(g.L1-g.L0)*sm+g.B*Math.pow(Math.sin(Math.PI*g.k*t),2); break; } }
    HS[j]=h; }
  STOPS.forEach(s=>{ s.oy=railY(s.x)-RAIL; s.done=false; s.announced=false; });
  // trees & decorations
  const nearStop=x=>STOPS.some(s=>Math.abs(x-s.x)<900);
  TREES=[]; for(let x=80;x<WORLD;){ const z=zoneAt(x); x+= z==='forest'?22+rng()*44:z==='snow'?40+rng()*80:z==='city'||z==='port'?400:60+rng()*120;
    if(!nearStop(x)&&z!=='city'&&z!=='port') TREES.push({x,s:.75+rng()*.55,d:2+rng()*26,z,t:rng()}); }
  TREES.sort((a,b)=>b.d-a.d);
  FG=[]; for(let x=40;x<WORLD;x+=34+rng()*70){ if(nearStop(x)) continue; FG.push({x,d:50+rng()*60,z:zoneAt(x),t:rng(),c:['#ff6b8b','#ffd23f','#ffffff','#b07cff','#ff9442'][Math.floor(rng()*5)]}); }
  CLOUDS=[]; for(let i=0;i<9;i++) CLOUDS.push({x:i*300+rng()*200,y:26+rng()*80,s:.7+rng()*.8});
  G.R=R;
}
function wagonLeft(k,pos){ return (pos===undefined?G.pos:pos)-LOCO_L-GAP-WAG_L-k*(GAP+WAG_L); }
function wagonCenter(k,pos){ return wagonLeft(k,pos)+WAG_L/2; }
function groupOf(s){ const t=s.k==='station'?'pax':s.k==='crane'?WAGON_FOR[s.cargo]:s.k==='tank'?'tank':null;
  const ks=[]; G.wagons.forEach((w,k)=>{ if(!t||w.type===t) ks.push(k); }); return ks; }
function mkLoad(cargo){ return {cargo,color:pick(['#9c3b2f','#2c5a83','#3d6e47','#b4742a','#7a3f63']),seed:Math.random()}; }

    chugAcc:0,smokeT:0,ended:false,endT:null,hornHeld:false,held:null,job:null,lastNag:-9,hintKey:'',

  STOPS.forEach(s=>{ const ks=groupOf(s), kmin=Math.min(...ks), kmax=Math.max(...ks);
    const off=LOCO_L+GAP+kmin*(GAP+WAG_L)+((kmax-kmin)*(GAP+WAG_L)+WAG_L)/2; s.target=s.x+off; s.ks=ks;
    s.wx=ks.map(k=>wagonCenter(k,s.target)); s.span=[Math.min(...s.wx)-WAG_L/2,Math.max(...s.wx)+WAG_L/2];
    s.items=[]; if(s.k==='crane'&&s.op==='load') s.items=s.wx.map(x=>({x,ld:mkLoad(s.cargo)}));
    s.tx=(s.span[0]+s.span[1])/2; s.hy=HOOK_REST; s.carry=null; s.arm=0; s.flow=0; });
  G.animals=ROUTE.animals.map(([e,x])=>({e,x,state:'on',t:0,dx:0,dy:0}));
  // passengers (pax route)
  const stIdx=STOPS.map((s,i)=>s.k==='station'?i:-1).filter(i=>i>=0);
  if(stIdx.length){ const C=8*G.wagons.filter(w=>w.type==='pax').length, n=Math.min(5,Math.floor(C/(stIdx.length-1)));
    stIdx.slice(0,-1).forEach((si,j)=>{ const s=STOPS[si]; for(let k=0;k<n;k++){ const dest=stIdx[j+1+Math.floor(Math.random()*(stIdx.length-1-j))];
      G.pax.push({st:si,dest,state:'waiting',x:s.x-PL/2+90+(k+.5)*(PL-180)/n+(Math.random()*24-12),y:FEET,alpha:1,skin:pick(SKINS),hair:pick(HAIRS),shirt:pick(COATS),leg:'#2a2e35',sz:.9+Math.random()*.2,ph:Math.random()*6,bag:Math.random()<.45,t:0,fy:s.oy}); } }); }
  G.pos=STOPS[0].target; G.next=0;
  if(STOPS[0].k==='depot'){ STOPS[0].done=true; G.next=1; }
  else G.held={type:'stop',i:0};

let toastT=null; function toast(m){ const t=$('toast'); t.innerHTML=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2000); }
function addFloat(x,y,text){ G.floaters.push({x,y,text,life:1.8}); }
function curStop(){ return G.held&&G.held.type==='stop'?STOPS[G.held.i]:null; }
function stopAction(){
  Sound.init(); vib(); if(!G.active||G.ended) return;
  const s=curStop(); if(!s||s.done||G.job){ if(!s&&!G.job) toast('Avance jusqu’à la grosse flèche ⬇️'); return; }
  if(s.k==='station'){ G.doorsOpen=true; G.dock=G.held.i; G.paxT=.9; G.paxDone=false; Sound.chime(); G.job={type:'station',s}; }
  else if(s.k==='crane') startCrane(s);
  else if(s.k==='tank'){ G.job={type:'tank',s,ph:0,t:0}; }
  Voice.stop();
}
function startCrane(s){
  const h=LOADS[s.cargo].h, st=[];
  s.ks.forEach((k,j)=>{ const wx=wagonCenter(k), w=G.wagons[k], deck=RAIL-(w.type==='crates'?33:w.type==='cont'?32:35);
    if(s.op==='load') st.push({t:'x',v:wx},{t:'y',v:PILE_BASE-h-HOOK_GAP},{t:'grab',k,wx},{t:'y',v:HOOK_REST},{t:'y',v:deck-h-HOOK_GAP},{t:'rel',k,wx},{t:'y',v:HOOK_REST});
    else st.push({t:'x',v:wx},{t:'y',v:deck-h-HOOK_GAP},{t:'grab',k,wx},{t:'y',v:HOOK_REST},{t:'y',v:PILE_BASE-h-HOOK_GAP},{t:'rel',k,wx},{t:'y',v:HOOK_REST}); });
  st.push({t:'x',v:(s.span[0]+s.span[1])/2});
  G.job={type:'crane',s,st,i:0,w:0};
}
function completeStop(s){
  s.done=true; G.job=null; G.held=null; G.stars++; Sound.ding(); Sound.ding2&&Sound.ding2();
  addFloat((s.span[0]+s.span[1])/2,s.oy+RAIL-150,'⭐ +1');
  refreshProgress();
  const idx=STOPS.indexOf(s);
  if(idx===STOPS.length-1){ G.endT=1.8; Voice.say('Bravo ! Tu as fini tout le voyage !'); celebrate(); }
  else { G.next=idx+1; Voice.say(pick(['Bravo !','Super !','Génial !'])+' Klaxonne, et en avant !'); toast('⭐ Bravo !'); }
}
function hornPress(){

}
function hornRelease(){ G.hornHeld=false; Sound.hornStop(); }
function celebrate(){ for(let i=0;i<140;i++) G.confetti.push({x:Math.random(),y:-Math.random()*.6,vx:(Math.random()-.5)*.15,vy:.15+Math.random()*.25,r:Math.random()*6.28,vr:(Math.random()-.5)*8,c:pick(['#f0a020','#e5484d','#3fb950','#4c8bd6','#c85d8c','#ffd23f'])}); }

/* ====================== update ====================== */
function emit(o){ G.particles.push(Object.assign({g:0},o,{max:o.life})); }
function locoPt(px,py){ const t=G.locoTf; const lx=px-LOCO_L/2; return [t.cx+Math.cos(t.a)*lx-Math.sin(t.a)*py, t.cy+Math.sin(t.a)*lx+Math.cos(t.a)*py]; }
function nextTarget(){ // nearest forced stop ahead
  let T=null, kind=null, ref=null;
  const s=STOPS[G.next]; if(s&&!s.done){ T=s.target; kind='stop'; ref=G.next; }
  for(const a of G.animals){ if(a.state!=='on') continue; const tp=a.x-70; if(tp>=G.pos-2&&(T===null||tp<T)){ T=tp; kind='animal'; ref=a; } }
  return T===null?null:{T,kind,ref};
}
function update(dt){
  G.time+=dt;
  const LO=LOCO, max=LO.max;
  let accel=false;
  if(G.ended){ G.speed=approach(G.speed,0,300*dt); }
  else if(G.held){
    G.speed=0;
    if((input.fwd||input.back)&&G.time-G.lastNag>4){ G.lastNag=G.time;
      if(G.held.type==='animal') Voice.say('Klaxonne pour faire partir l’animal !');
      else if(!G.job) Voice.say('D’abord, appuie sur le bouton qui clignote !'); }
  } else {
    // slope from all vehicles
    let sl=dH(G.pos-LOCO_L/2); G.wagons.forEach((w,k)=>sl+=dH(wagonCenter(k))); sl/=G.wagons.length+1;
    if(input.brake) G.speed=approach(G.speed,0,320*dt);
    else if(input.fwd){ if(G.speed<0) G.speed=approach(G.speed,0,320*dt); else if(G.speed<max){ G.speed=Math.min(max,G.speed+LO.acc*dt); } accel=true; }
    else if(input.back){ if(G.speed>0) G.speed=approach(G.speed,0,320*dt); else if(G.speed>-max*.4) G.speed=Math.max(-max*.4,G.speed-LO.acc*.7*dt); accel=true; }
    else G.speed=approach(G.speed,0,14*dt);
    if(!input.brake) G.speed-=GRAV*sl*dt;
    else if(Math.abs(G.speed)<2) G.speed=0;
    if(Math.abs(G.speed)>max) G.speed-=Math.sign(G.speed)*(Math.abs(G.speed)-max)*.7*dt;
    // automatic stop
    const nt=nextTarget();
    if(nt&&G.speed>=0){ const d=nt.T-G.pos;
      if(d<=Math.max(30,G.speed*G.speed/(2*230)+30)){
        if(d<=1){ G.pos=nt.T; G.speed=0; G.held=nt.kind==='stop'?{type:'stop',i:nt.ref}:{type:'animal',a:nt.ref};
          if(nt.kind==='stop'){ Sound.brake(); } else { Voice.say('Oh ! '+animalName(nt.ref.e)+' sur la voie ! Klaxonne !'); } }
        else { const need=G.speed*G.speed/(2*Math.max(d,1)); G.speed=Math.max(Math.min(G.speed,60),G.speed-need*dt*1.05); if(G.speed<28) G.speed=Math.min(28,d/dt); accel=false; } } }
  }
  if(!G.held){ G.pos+=G.speed*dt; G.dist+=G.speed*dt; }
  if(G.pos>WORLD-80){ G.pos=WORLD-80; G.speed=Math.min(0,G.speed); }
  if(G.pos-TL<60){ G.pos=60+TL; G.speed=Math.max(0,G.speed); }
  G.doorAnim=approach(G.doorAnim,G.doorsOpen?1:0,dt*2.2);

  // announce next stop
  const ns=STOPS[G.next]; if(ns&&!ns.announced&&ns.target-G.pos<1500&&ns.target-G.pos>0){ ns.announced=true; Voice.say('Voici '+stopSay(ns)+' !'); }

  // animals
  for(const a of G.animals){ if(a.state==='leaving'){ a.t+=dt; a.dx=a.t*40; a.dy=a.t*a.t*60; if(a.t>1.4){ a.state='gone'; if(G.held&&G.held.type==='animal'&&G.held.a===a) G.held=null; } } }

  // jobs
  const j=G.job; let motor=false, flow=false;
  if(j&&j.type==='station') updateStation(dt,j.s);
  else if(j&&j.type==='crane') motor=updateCrane(dt,j);
  else if(j&&j.type==='tank') flow=updateTank(dt,j);
  Sound.setMotor(motor); Sound.setFlow(flow);
  for(const p of G.pax) updatePerson(p,dt);
  if(G.endT!==null){ G.endT-=dt; if(G.endT<=0){ G.endT=null; endGame(); } }

  // smoke
  const frac=Math.abs(G.speed)/max, ch=LO.ch;
  if(G.locoTf){

  c.strokeStyle='#30353c'; c.lineWidth=2; for(let x=s.x-PL/2+40;x<s.x+PL/2;x+=180){ line(c,x,288,x,236); c.fillStyle='#f5e7b8'; c.fillRect(x-4,232,8,6); }
}
function drawPlatform(c,s){ const x0=s.x-PL/2;
  c.fillStyle='#c9c2b3'; c.fillRect(x0,302,PL,20); c.fillStyle='#f2f0ea'; c.fillRect(x0,302,PL,2); c.fillStyle='#f2c230'; c.fillRect(x0,306,PL,4);
  c.fillStyle='#8f877a'; c.fillRect(x0,322,PL,26); c.strokeStyle='rgba(0,0,0,.12)'; c.lineWidth=1; for(let x=x0;x<x0+PL;x+=30) line(c,x,322,x,348);
  [x0+PL*.25,x0+PL*.75].forEach(x=>label(c,x,336,s.name)); }

/* ====================== loop & input ====================== */
const ICONS={
  doors:'<svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.4"><rect x="6" y="4" width="20" height="25" rx="2"/><path d="M16 4v25M12 15l-3 2 3 2M20 15l3 2-3 2"/></svg>',
  crane:'<svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.4"><path d="M8 29V5M4 29h10M8 6h21M8 6l6-4 9 4M24 6v9"/><path d="M20 15h8v6h-8z" fill="#fff"/></svg>',
  fill:'<svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.4"><path d="M6 6h14v6M16 12v5"/><path d="M16 19c-2 3-3 4-3 6a3 3 0 006 0c0-2-1-3-3-6z" fill="#fff"/><rect x="4" y="23" width="0" height="0"/></svg>',
  empty:'<svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.4"><rect x="4" y="5" width="18" height="11" rx="5"/><path d="M13 16v4"/><path d="M13 22c-2 3-3 4-3 5a3 3 0 006 0c0-1-1-2-3-5z" fill="#fff"/></svg>',
  hand:'<svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.4"><circle cx="16" cy="16" r="10"/><circle cx="16" cy="16" r="3" fill="#fff"/></svg>'};
let lastT=performance.now();
function loop(now){ const dt=Math.min(.05,(now-lastT)/1000); lastT=now; if(G.active){ update(dt); render(); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
function holdBtn(el,on,off){
  const down=e=>{ e.preventDefault(); Sound.init(); vib(); el.classList.add('down'); try{el.setPointerCapture(e.pointerId);}catch(_){} on(); };
  const up=()=>{ if(!el.classList.contains('down')) return; el.classList.remove('down'); off(); };
  el.addEventListener('pointerdown',down); ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,up)); el.addEventListener('contextmenu',e=>e.preventDefault()); }
holdBtn($('bFwd'),()=>input.fwd=true,()=>input.fwd=false);
holdBtn($('bBack'),()=>input.back=true,()=>input.back=false);
holdBtn($('bBrake'),()=>input.brake=true,()=>input.brake=false);
holdBtn($('bHorn'),hornPress,hornRelease);
$('bAct').addEventListener('pointerdown',e=>{ e.preventDefault(); $('bAct').classList.add('down'); stopAction(); });
['pointerup','pointercancel','pointerleave'].forEach(ev=>$('bAct').addEventListener(ev,()=>$('bAct').classList.remove('down')));
$('bAct').addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
$('game').addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
const KEYMAP={ArrowRight:'fwd',KeyD:'fwd',ArrowLeft:'back',KeyA:'back',KeyQ:'back',ArrowDown:'brake',KeyS:'brake'};
window.addEventListener('keydown',e=>{ if(!G.active||G.ended) return;
  if(KEYMAP[e.code]){ e.preventDefault(); Sound.init(); input[KEYMAP[e.code]]=true; }
  else if(e.code==='KeyK'||e.code==='KeyH'){ e.preventDefault(); if(!e.repeat) hornPress(); }
  else if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(!e.repeat) stopAction(); } });
window.addEventListener('keyup',e=>{ if(KEYMAP[e.code]) input[KEYMAP[e.code]]=false; if(e.code==='KeyK'||e.code==='KeyH') hornRelease(); });
window.addEventListener('blur',()=>{ input.fwd=input.back=input.brake=false; if(G.active) hornRelease(); document.querySelectorAll('.ctl.down').forEach(b=>b.classList.remove('down')); });

function startGame(){
  $('menu').classList.add('hidden'); $('endOv').classList.add('hidden'); $('game').classList.remove('hidden');
  Sound.init(); newGame(); lastAct=''; Sound.startEngine(LOCO.fx==='steam'?'steam':LOCO.fx==='diesel'?'diesel':'electric');
}
function toMenu(){ G.active=false; Sound.stopEngine(); Sound.setFlow(false); hornRelease(); Voice.stop(); $('game').classList.add('hidden'); $('endOv').classList.add('hidden'); $('menu').classList.remove('hidden'); refreshMenu(); }
$('startBtn').onclick=startGame; $('againBtn').onclick=startGame; $('backBtn').onclick=toMenu; $('menuBtn').onclick=toMenu;
$('sndBtn').onclick=()=>{ Sound.init(); Sound.setOn(!Sound.on); $('sndBtn').classList.toggle('off',!Sound.on); };
$('voiceBtn').onclick=()=>{ Voice.on=!Voice.on; if(!Voice.on) Voice.stop(); $('voiceBtn').classList.toggle('off',!Voice.on); };
let rsT=null; window.addEventListener('resize',()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ if(!$('menu').classList.contains('hidden')) refreshMenu(); },120); });
buildMenu();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(!$('menu').classList.contains('hidden')) refreshMenu(); });

</script>
