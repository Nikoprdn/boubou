<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1318">
<title>Le petit train de Boubou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1318;--panel:#161b22;--panel2:#1d242d;--line:#2a323d;--text:#e7eaee;--muted:#8d97a5;--accent:#f0a020;--ok:#3fb950;--danger:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Barlow,system-ui,sans-serif;overscroll-behavior:none}
body{touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
.cond{font-family:'Barlow Condensed',Barlow,sans-serif}

/* ================= MENU ================= */
#menu{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mwrap{max-width:1180px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 120px}
.brand{display:flex;align-items:center;gap:14px;margin:4px 0 22px}
.logo{width:54px;height:54px;border-radius:14px;background:linear-gradient(145deg,#f0a020,#b86e00);display:grid;place-items:center;flex:none}
.brand h1{margin:0;font:700 clamp(28px,5vw,44px)/1 'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase}
.brand p{margin:4px 0 0;color:var(--muted);font-size:15px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.sec h2{margin:0 0 12px;font:600 20px 'Barlow Condensed',sans-serif;letter-spacing:.6px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sec h2 .n{color:var(--accent);font-size:15px;border:1px solid var(--accent);border-radius:6px;padding:0 6px}
.routes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:760px){.routes{grid-template-columns:1fr}}
.rcard{text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.rcard.sel{border-color:var(--accent);background:#221d14}
.rtop{display:flex;align-items:center;gap:8px;justify-content:space-between}
.rcard .lbl{font:700 13px 'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;color:#111;background:var(--accent);border-radius:5px;padding:1px 7px}
.rcard .km{color:var(--muted);font-size:14px}
.rcard h3{margin:6px 0 2px;font:600 20px 'Barlow Condensed',sans-serif}
.rcard p{margin:0 0 8px;color:var(--muted);font-size:14px;line-height:1.35}
.rcard svg{width:100%;height:30px;display:block}
.cargos{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.cg{font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:#cfd5dd}
.locos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.lcard{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:6px 6px 9px;text-align:left}
.lcard.sel{border-color:var(--accent)}
.lcard canvas{width:100%;height:80px;display:block;border-radius:9px;background:linear-gradient(#c9d5de,#e8edf0)}
.lcard .nm{font:600 17px 'Barlow Condensed',sans-serif;margin:6px 2px 0}
.lcard .meta{font-size:12.5px;color:var(--muted);margin:0 2px}
.swrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);padding:0}
.sw.sel{outline:3px solid var(--accent);outline-offset:2px}
.cust{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-left:6px}
.cust input{width:44px;height:40px;border:none;padding:0;background:none}
#colName{color:var(--muted);font-size:14px;margin-top:8px}
#compPreview{width:100%;height:120px;display:block;border-radius:12px;background:linear-gradient(#c9d5de,#e8edf0 72%,#9aa58a 72%)}
.slots{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.slot{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.slot .sn{font:600 14px 'Barlow Condensed',sans-serif;color:var(--muted);width:54px;flex:none}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}
.opt{background:#141920;border:2px solid var(--line);border-radius:10px;padding:3px 3px 4px;font-size:12px;line-height:1.1}
.opt.sel{border-color:var(--accent);background:#221d14}
.opt canvas{width:100%;height:30px;display:block}
.rm{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#141920;font-size:20px;flex:none}
.comprow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sbtn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:15px}
#compWarn{color:#f6c35b;font-size:14px;margin-top:8px;min-height:18px}
.startbar{position:fixed;left:0;right:0;bottom:0;background:rgba(15,19,24,.94);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
#sumTxt{color:var(--muted);font-size:14px;max-width:560px}
.go{background:var(--accent);color:#111;border:none;border-radius:12px;padding:13px 28px;font:700 20px 'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;flex:none}
@media (max-width:560px){#sumTxt{display:none}.go{width:100%}}

/* ================= GAME ================= */
#game{position:fixed;inset:0;display:grid;background:var(--bg);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  grid-template-areas:"stage stage stage" "l info r";grid-template-columns:auto 1fr auto;grid-template-rows:1fr auto;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#stage{grid-area:stage;position:relative;min-height:0;min-width:0;overflow:hidden;background:#cfdbe3}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ctlL{grid-area:l}#ctlR{grid-area:r}#info{grid-area:info}
.ctlgrp{display:grid;grid-template-columns:repeat(2,minmax(92px,1fr));gap:8px;padding:10px;background:var(--panel)}
.ctlgrp .wide{grid-column:span 2}
.ctl{position:relative;min-height:64px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:#252d38;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px;touch-action:none;
  font:600 14px 'Barlow Condensed',sans-serif;letter-spacing:.6px;text-transform:uppercase;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);transition:transform .05s,filter .1s}
.ctl svg{width:30px;height:30px;flex:none}
.ctl.down{transform:scale(.96);filter:brightness(1.3)}
.ctl:disabled{opacity:.38}
#bFwd{background:#1f6a43}#bBack{background:#2c5684}#bBrake{background:#7e2a2a}
#bHorn{background:#7c5c14}#bDoors{background:#433779}#bDoors.open{background:#1d6e67}#bCrane{background:#8b5318}
.ctl.ready{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,160,32,.9),inset 0 -3px 0 rgba(0,0,0,.3)}50%{box-shadow:0 0 0 5px rgba(240,160,32,.35),inset 0 -3px 0 rgba(0,0,0,.3)}}
#info{background:var(--panel);padding:10px 14px;overflow:auto;min-width:0;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.inext{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.inext .k{font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.inext b{font:600 20px 'Barlow Condensed',sans-serif}
.inext span{color:var(--accent);font-weight:600}
.mis{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.mrow{display:flex;align-items:center;gap:8px;font-size:14px}
.mrow .mt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .bar{width:70px;height:6px;background:#2a323d;border-radius:4px;overflow:hidden;flex:none}
.mrow .bar i{display:block;height:100%;background:var(--accent)}
.mrow.done .bar i{background:var(--ok)}
.mrow .v{font-weight:600;width:40px;text-align:right;flex:none}
.mrow.na{opacity:.45}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.wag{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.wchip{font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px 7px;color:#cfd5dd}
.wchip.full{border-color:#4d6b3a;color:#bfe3a8}
.tip{color:var(--muted);font-size:13px;margin-top:8px}

/* HUD overlay */
#hud{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;padding:8px;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
.hc{background:rgba(15,19,24,.74);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:4px 10px;font-size:14px;white-space:nowrap;backdrop-filter:blur(4px)}
.hc b{font-weight:700}
#hSpeed{min-width:92px;text-align:center}
#hLim{background:rgba(160,40,40,.85)}
.hr{margin-left:auto;display:flex;gap:6px;pointer-events:auto}
.ib{width:38px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(15,19,24,.74);display:grid;place-items:center;padding:0}
.ib svg{width:20px;height:20px}
#finishBtn{width:auto;padding:0 12px;background:var(--ok);color:#06210d;font:700 15px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.6px}
.landOnly{display:none}
#hint{position:absolute;left:50%;top:50px;transform:translateX(-50%);background:rgba(15,19,24,.82);border-left:4px solid var(--accent);
  padding:7px 14px;border-radius:8px;font-size:clamp(13px,1.8vw,17px);font-weight:500;max-width:94%;text-align:center;pointer-events:none;white-space:normal}
#hint:empty{display:none}
#toast{position:absolute;left:50%;bottom:40px;transform:translate(-50%,8px);background:rgba(240,240,240,.97);color:#111;
  padding:8px 16px;border-radius:10px;font-weight:600;font-size:clamp(14px,1.9vw,18px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:92%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#mm{position:absolute;left:10px;right:10px;bottom:8px;height:22px;pointer-events:none}
#mmLine{position:absolute;left:0;right:0;top:10px;height:3px;background:rgba(15,19,24,.55);border-radius:3px}
.mmS{position:absolute;top:5px;width:12px;height:12px;transform:translateX(-50%);border:2px solid #0f1318;background:#e7eaee;border-radius:50%}
.mmS.fr{border-radius:2px;background:#f0a020}
.mmS.done{background:var(--ok)}
#mmT{position:absolute;top:2px;height:18px;transform:translateX(-50%);background:var(--accent);border:2px solid #0f1318;border-radius:4px}

/* phone portrait */
@media (max-width:820px) and (orientation:portrait){
  #game{grid-template-areas:"stage stage" "info info" "l r";grid-template-columns:1fr 1fr;grid-template-rows:min(88vw,58dvh) minmax(0,1fr) auto}
  #info{border:none;border-top:1px solid var(--line)}
  .ctlgrp{grid-template-columns:1fr 1fr;padding:8px}
  .ctl{min-height:70px}
  #ctlL{padding-right:4px}#ctlR{padding-left:4px}
  .hc{font-size:13px;padding:3px 8px}
  #hint{top:44px}
  #toast{font-size:14px;bottom:34px}
  
}
/* phone landscape */
@media (orientation:landscape) and (max-height:540px){
  #game{grid-template-areas:"l stage r";grid-template-columns:clamp(136px,20vw,190px) 1fr clamp(86px,12vw,116px);grid-template-rows:1fr}
  #info{display:none}
  .ctlgrp{padding:8px 6px;gap:6px}
  #ctlL{grid-template-columns:1fr 1fr;grid-template-rows:2fr 1fr}
  #ctlR{grid-template-columns:1fr;grid-auto-rows:1fr}
  #ctlR .wide{grid-column:auto}
  .ctl{min-height:0}
  .landOnly{display:block}
  .hc{font-size:12.5px;padding:3px 7px}
  #hint{top:auto;bottom:30px;font-size:13px}
  #mm{bottom:4px}
  #toast{bottom:auto;top:72px;font-size:14px}
}
#rotTip{display:none}
@media (max-width:820px) and (orientation:portrait){#rotTip{display:block}}

/* end overlay */
#endOv{position:fixed;inset:0;background:rgba(5,8,12,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.ecard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:440px;width:100%;text-align:center}
.ecard h2{margin:0;font:700 30px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:1px}
#eStars{margin:10px 0;display:flex;justify-content:center;gap:8px}
#eStats{text-align:left;font-size:16px;line-height:1.75;margin:8px auto 18px;max-width:330px}
#eStats b{float:right}
.ebtns{display:flex;gap:10px}.ebtns button{flex:1}
.go.sec2{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
</style>
</head>
<body>

<!-- ================= MENU ================= -->
<section id="menu">
 <div class="mwrap">
  <div class="brand">
   <div class="logo"><svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#111" stroke-width="2.4" stroke-linejoin="round"><rect x="5" y="6" width="24" height="17" rx="3"/><path d="M5 15h24M11 6v9M23 6v9"/><circle cx="11" cy="27" r="2.5"/><circle cx="23" cy="27" r="2.5"/></svg></div>
   <div><h1>Le petit train de Boubou</h1><p>Voyageurs, bois, caisses et conteneurs : à toi de conduire.</p></div>
  </div>

  <div class="sec"><h2><span class="n">01</span>Parcours</h2><div class="routes" id="routes"></div></div>
  <div class="sec"><h2><span class="n">02</span>Locomotive</h2><div class="locos" id="locos"></div></div>
  <div class="sec"><h2><span class="n">03</span>Livrée</h2>
    <div class="swrow" id="swatches"></div>
    <div id="colName"></div>
  </div>
  <div class="sec"><h2><span class="n">04</span>Composition du train</h2>
    <canvas id="compPreview"></canvas>
    <div class="slots" id="slots"></div>
    <div class="comprow"><button class="sbtn" id="addW">＋ Ajouter un wagon</button><button class="sbtn" id="recW">Composition conseillée</button></div>
    <div id="compWarn"></div>
  </div>
 </div>
 <div class="startbar"><div id="sumTxt"></div><button class="go" id="startBtn">Départ</button></div>
</section>

<!-- ================= GAME ================= -->
<section id="game" class="hidden">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="hc">Score <b id="hScore">0</b></div>
      <div class="hc" id="hSpeed"><b id="hKmh">0</b> km/h</div>
      <div class="hc hidden" id="hLim">Limite 45</div>
      <div class="hc landOnly" id="hNextL"></div>
      <div class="hc landOnly" id="hMisL"></div>
      <div class="hr">
        <button class="ib hidden" id="finishBtn">Terminer</button>
        <button class="ib" id="fsBtn" title="Plein écran"><svg viewBox="0 0 24 24" fill="none" stroke="#e7eaee" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="ib" id="sndBtn" title="Son"><svg viewBox="0 0 24 24" fill="none" stroke="#e7eaee" stroke-width="2"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="sndWave" d="M16 9c1.5 1.5 1.5 4.5 0 6M18.5 6.5c3 3 3 8 0 11"/></svg></button>
        <button class="ib" id="menuBtn" title="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="#e7eaee" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
    </div>
    <div id="hint"></div>
    <div id="toast"></div>
    <div id="mm"><div id="mmLine"></div><div id="mmT"></div></div>
  </div>

  <div id="ctlL" class="ctlgrp">
    <button class="ctl" id="bBack"><svg viewBox="0 0 32 32" fill="#fff"><path d="M20 6 8 16l12 10z"/></svg>Reculer</button>
    <button class="ctl" id="bFwd"><svg viewBox="0 0 32 32" fill="#fff"><path d="M12 6l12 10-12 10z"/></svg>Avancer</button>
    <button class="ctl wide" id="bBrake"><svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.6"><circle cx="16" cy="16" r="11"/><path d="M10 16h12"/></svg>Freiner</button>
  </div>

  <div id="info">
    <div class="inext"><span class="k">Prochain arrêt</span><b id="iNext">—</b><span id="iDist"></span></div>
    <div class="mis" id="iMis"></div>
    <div class="wag" id="iWag"></div>
    <div class="tip" id="rotTip">Astuce : tourne ton téléphone pour jouer en grand écran.</div>
  </div>

  <div id="ctlR" class="ctlgrp">
    <button class="ctl" id="bHorn"><svg viewBox="0 0 32 32" fill="#fff"><path d="M4 13h5l14-7v20L9 19H4z"/><path d="M26 11v10" stroke="#fff" stroke-width="2.4"/></svg>Klaxon</button>
    <button class="ctl" id="bCrane"><svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.2"><path d="M8 29V5M4 29h10M8 6h21M8 6l6-4 9 4M24 6v9"/><path d="M21 15h6v5h-6z" fill="#fff"/></svg>Grue</button>
    <button class="ctl wide" id="bDoors"><svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.2"><rect x="6" y="4" width="20" height="25" rx="2"/><path d="M16 4v25M12 15l-3 2 3 2M20 15l3 2-3 2"/></svg><span id="doorLbl">Ouvrir portes</span></button>
  </div>
</section>

<div id="endOv" class="hidden"><div class="ecard">
  <h2 id="eTitle">Terminus</h2><div id="eStars"></div><div id="eStats"></div>
  <div class="ebtns"><button class="go" id="againBtn">Rejouer</button><button class="go sec2" id="backBtn">Menu</button></div>
</div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);

/* ====================== helpers ====================== */
function toRgb(c){ if(c.startsWith('rgb')) return c.match(/\d+/g).slice(0,3).map(Number);
  let h=c.replace('#',''); if(h.length===3) h=h.split('').map(x=>x+x).join(''); const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function mix(a,b,t){const A=toRgb(a),B=toRgb(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')';}
const light=(c,t)=>mix(c,'#ffffff',t), dark=(c,t)=>mix(c,'#000000',t);
function rr(c,x,y,w,h,r){c.beginPath(); if(c.roundRect) c.roundRect(x,y,w,h,r); else c.rect(x,y,w,h);}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2);}
function line(c,x1,y1,x2,y2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
function approach(v,t,d){return v<t?Math.min(t,v+d):Math.max(t,v-d);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const meters=px=>Math.max(1,Math.round(Math.abs(px)/2));
function vib(ms=12){ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(e){} }
function bodyGrad(c,y0,y1,col){const g=c.createLinearGradient(0,y0,0,y1); g.addColorStop(0,light(col,.2)); g.addColorStop(.45,col); g.addColorStop(1,dark(col,.32)); return g;}
function glassGrad(c,y0,y1){const g=c.createLinearGradient(0,y0,0,y1); g.addColorStop(0,'#6e8597'); g.addColorStop(1,'#1c2733'); return g;}
function cabWin(c,x,y,w,h,r,sx){ c.fillStyle=glassGrad(c,y,y+h); rr(c,x,y,w,h,r); c.fill();
  if(sx!==undefined){ c.save(); rr(c,x,y,w,h,r); c.clip(); c.fillStyle='rgba(8,11,16,.85)'; circ(c,sx,y+h*.45,4.4); c.fill(); rr(c,sx-7,y+h*.45+4,14,12,4); c.fill(); c.restore(); }
  c.strokeStyle='rgba(255,255,255,.18)'; c.lineWidth=1; line(c,x+2,y+h-3,x+w*.6,y+2); }
function plate(c,x,y,txt){ c.font='600 7px "Barlow Condensed",sans-serif'; const w=c.measureText(txt).width+6; c.fillStyle='#16181c'; c.fillRect(x-w/2,y-7,w,9); c.fillStyle='#d9c27a'; c.textAlign='center'; c.fillText(txt,x,y); }

/* ====================== vehicles ====================== */
function wheel(c,x,y,r,a,rim){
  c.fillStyle='#202226'; circ(c,x,y,r); c.fill();

function drawLoad(c,ld,cx,bottom){
  const L=LOADS[ld.cargo], w=L.w, h=L.h, x=cx-w/2, y=bottom-h;
  if(ld.cargo==='logs'){
    const rh=12, tones=['#5a3f29','#6a4a30','#4e3725'];
    for(let r=0;r<3;r++){
      const inset=r===2?10:r===1?4:0;
      for(let k=1;k>=0;k--){
        const yy=bottom-(r+1)*rh-(k?2:0), lx=x+inset+(k?5:0), len=w-inset*2-(k?4:0);
        c.fillStyle=k?dark(tones[r],.25):tones[(r+k)%3]; rr(c,lx,yy,len,rh,rh/2); c.fill();
        if(!k){ c.strokeStyle='rgba(0,0,0,.25)'; c.lineWidth=1; line(c,lx+8,yy+4,lx+len*.5,yy+4); line(c,lx+len*.4,yy+8,lx+len-10,yy+8); }
        c.fillStyle=k?'#a78659':'#c8a46c'; c.beginPath(); c.ellipse(lx+len-4,yy+rh/2,3.8,rh/2-.5,0,0,7); c.fill();
        c.strokeStyle='#8e6d40'; c.lineWidth=.8; c.beginPath(); c.ellipse(lx+len-4,yy+rh/2,1.8,rh/4,0,0,7); c.stroke();
      }
    }
    c.strokeStyle='#2a2c30'; c.lineWidth=2; line(c,x+26,y,x+26,bottom); line(c,x+w-28,y,x+w-28,bottom);
  } else if(ld.cargo==='crates'){
    const cw=w/3, ch=h/2;
    for(let r=0;r<2;r++) for(let k=0;k<3;k++){
      const bx=x+k*cw, by=bottom-(r+1)*ch;
      c.fillStyle=(r+k)%2?'#a07a48':'#b08852'; c.fillRect(bx+.5,by+.5,cw-1,ch-1);
      c.strokeStyle='#6c5031'; c.lineWidth=1.6; c.strokeRect(bx+1.5,by+1.5,cw-3,ch-3);
      c.lineWidth=1; line(c,bx+3,by+ch-3,bx+cw-3,by+3);
      c.strokeStyle='rgba(60,40,20,.35)'; line(c,bx+2,by+ch/2,bx+cw-2,by+ch/2);
      if((r*3+k)%4===1){ c.fillStyle='rgba(30,30,30,.55)'; c.font='600 6px "Barlow Condensed",sans-serif'; c.textAlign='center'; c.fillText('BOUBOU',bx+cw/2,by+ch/2+2); }
    }
  } else {
    const g=c.createLinearGradient(0,y,0,bottom); g.addColorStop(0,light(ld.color,.15)); g.addColorStop(1,dark(ld.color,.25));
    c.fillStyle=g; c.fillRect(x,y,w,h);
    c.strokeStyle='rgba(0,0,0,.22)'; c.lineWidth=1; for(let xx=x+5;xx<x+w-12;xx+=4) line(c,xx,y+3,xx,bottom-3);
    c.fillStyle='rgba(0,0,0,.25)'; c.fillRect(x,y,w,3); c.fillRect(x,bottom-3,w,3);
    c.strokeStyle='rgba(0,0,0,.35)'; c.lineWidth=1.4; for(let k=0;k<3;k++) line(c,x+w-10+k*3,y+4,x+w-10+k*3,bottom-4);
    c.fillStyle='#1c1e22'; [[x,y],[x+w-4,y],[x,bottom-4],[x+w-4,bottom-4]].forEach(p=>c.fillRect(p[0],p[1],4,4));
    c.fillStyle='rgba(255,255,255,.85)'; c.font='700 10px "Barlow Condensed",sans-serif'; c.textAlign='left'; c.fillText('BOUBOU LINES',x+10,y+17);
    c.font='500 6px "Barlow Condensed",sans-serif'; c.fillText('BBU '+(1000+Math.floor(ld.seed*8999)),x+10,y+26);
  }

const HORNS={steam:{w:'triangle',f:[466,587,698],v:.11,lp:3200,br:true},western:{w:'triangle',f:[294,370,440],v:.14,lp:2200,br:true},
 diesel:{w:'sawtooth',f:[277,349,415],v:.06,lp:1600},shunter:{w:'square',f:[440,554],v:.045,lp:1800},electric:{w:'sawtooth',f:[370,466],v:.07,lp:2400},hsr:{w:'triangle',f:[659,880],v:.14,lp:4000}};
const Sound={ac:null,master:null,on:true,noise:null,engine:null,horn:null,motor:null,
 init(){ if(this.ac){ if(this.ac.state==='suspended') this.ac.resume(); return; }
  try{ this.ac=new (window.AudioContext||window.webkitAudioContext)(); this.master=this.ac.createGain(); this.master.gain.value=this.on?.6:0; this.master.connect(this.ac.destination);
   const len=this.ac.sampleRate, b=this.ac.createBuffer(1,len,len), d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; this.noise=b; }catch(e){ this.ac=null; } },
 setOn(v){ this.on=v; if(this.master) this.master.gain.value=v?.6:0; },
 tone(f,dur,type='sine',vol=.2,when=0){ if(!this.ac) return; const t=this.ac.currentTime+when, o=this.ac.createOscillator(), g=this.ac.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+.05); },
 chime(){ [659,523,784].forEach((f,i)=>this.tone(f,.8,'sine',.14,i*.32)); },
 beep(){ for(let i=0;i<3;i++) this.tone(880,.13,'square',.04,i*.24); },
 ding(){ this.tone(1320,.25,'triangle',.08); },
 noiseBurst(vol,dur,freq){ if(!this.ac) return; const t=this.ac.currentTime, s=this.ac.createBufferSource(); s.buffer=this.noise; const f=this.ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq;
  const g=this.ac.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); s.connect(f); f.connect(g); g.connect(this.master); s.start(t,Math.random()*.5); s.stop(t+dur+.05); },
 chug(v){ this.noiseBurst(v,.16,700); }, clunk(){ this.noiseBurst(.35,.25,300); this.tone(110,.2,'square',.05); },
 startEngine(kind){ this.stopEngine(); if(!this.ac||kind==='steam') return; const o=this.ac.createOscillator(), f=this.ac.createBiquadFilter(), g=this.ac.createGain();
  o.type=kind==='diesel'?'sawtooth':'sine'; o.frequency.value=kind==='diesel'?42:110; f.type='lowpass'; f.frequency.value=kind==='diesel'?260:900; g.gain.value=0; o.connect(f); f.connect(g); g.connect(this.master); o.start(); this.engine={o,g,kind}; },
 updateEngine(fr,acc){ const e=this.engine; if(!e) return; const t=this.ac.currentTime;
  if(e.kind==='diesel'){ e.o.frequency.setTargetAtTime(42+fr*40+(acc?12:0),t,.2); e.g.gain.setTargetAtTime(.055+fr*.05+(acc?.035:0),t,.2); }
  else { e.o.frequency.setTargetAtTime(110+fr*520,t,.2); e.g.gain.setTargetAtTime(fr>.01?.012+fr*.025:0,t,.2); } },
 stopEngine(){ if(this.engine){ try{this.engine.o.stop();}catch(e){} this.engine=null; } this.setMotor(false); },
 setMotor(on){ if(!this.ac) return; if(on&&!this.motor){ const o=this.ac.createOscillator(), f=this.ac.createBiquadFilter(), g=this.ac.createGain(); o.type='sawtooth'; o.frequency.value=70; f.type='lowpass'; f.frequency.value=500; g.gain.value=.035; o.connect(f); f.connect(g); g.connect(this.master); o.start(); this.motor={o,g}; }
  else if(!on&&this.motor){ try{this.motor.o.stop();}catch(e){} this.motor=null; } },
 hornStart(type){ if(!this.ac||this.horn) return; const h=HORNS[type], ac=this.ac, t=ac.currentTime, g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(h.v,t+.06);
  const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=h.lp; g.connect(f); f.connect(this.master);
  const lfo=ac.createOscillator(); lfo.frequency.value=5.5; const lg=ac.createGain(); lg.gain.value=3; lfo.connect(lg); lfo.start();
  const srcs=h.f.map(fr=>{const o=ac.createOscillator(); o.type=h.w; o.frequency.value=fr; lg.connect(o.frequency); o.connect(g); o.start(); return o;}); srcs.push(lfo);
  if(h.br){ const n=ac.createBufferSource(); n.buffer=this.noise; n.loop=true; const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=h.f[1]*2; bp.Q.value=2; const ng=ac.createGain(); ng.gain.value=.35; n.connect(bp); bp.connect(ng); ng.connect(g); n.start(); srcs.push(n); }
  this.horn={g,srcs,t0:t}; },
 hornStop(){ const h=this.horn; if(!h) return; this.horn=null; const t=Math.max(this.ac.currentTime,h.t0+.35); h.g.gain.setTargetAtTime(0,t,.07); h.srcs.forEach(s=>{try{s.stop(t+.6);}catch(e){}}); }
};

function prepCanvas(cv){ const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight; if(!w||!h) return null; cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); return {c:cv.getContext('2d'),w,h,dpr}; }
function previewTrack(c,len){ c.fillStyle='#8f8a80'; c.fillRect(-14,0,len+28,9); c.fillStyle='#b5b0a6'; for(let x=-10;x<len+14;x+=14) c.fillRect(x,1,8,4); c.fillStyle='#6f7278'; c.fillRect(-14,-3,len+28,3.5); }
function drawTrainOn(c,loco,col,comp,s){ // draws loco at right, wagons left; origin = leftmost
  let x=0; for(let k=comp.length-1;k>=0;k--){ c.save(); c.translate(x,0); drawWagon(c,comp[k],col,s,0,loco.hsr); c.restore(); c.fillStyle='#1c1e22'; c.fillRect(x+WAG_L-1,-24,GAP+2,3); x+=WAG_L+GAP; }
  c.save(); c.translate(x,0); loco.draw(c,col,s); c.restore(); }
function previewLoco(cv,loco){ const p=prepCanvas(cv); if(!p) return; const {c,w,h,dpr}=p; const TW=LOCO_L+30, TH=146, k=Math.min(w/TW,h/TH);
  c.setTransform(dpr*k,0,0,dpr*k,(w-TW*k)/2*dpr,(h-TH*k)*dpr); c.translate(15,138); previewTrack(c,LOCO_L); loco.draw(c,COLOR,{wheel:.6}); }
function previewWagon(cv,type){ const p=prepCanvas(cv); if(!p) return; const {c,w,h,dpr}=p; const TW=WAG_L+6, TH=96, k=Math.min(w/TW,h/TH);
  c.setTransform(dpr*k,0,0,dpr*k,(w-TW*k)/2*dpr,(h-TH*k)*dpr); c.translate(3,92);
  const cg=WTYPES[type].cargo; drawWagon(c,{type,cargo:cg?{cargo:cg,color:'#2c5a83',seed:.3}:null,seats:[]},COLOR,{wheel:0},0,LOCO.hsr); }
function previewComp(){ const cv=$('compPreview'), p=prepCanvas(cv); if(!p) return; const {c,w,h,dpr}=p;
  const TL=LOCO_L+COMP.length*(WAG_L+GAP), TW=TL+40, TH=150, k=Math.min(w/TW,h/TH);
  c.setTransform(dpr*k,0,0,dpr*k,(w-TW*k)/2*dpr,(h*.72-140*k)*dpr); c.translate(20,138); previewTrack(c,TL);
  drawTrainOn(c,LOCO,COLOR,COMP.map(t=>({type:t,cargo:null,seats:[]})),{wheel:.4}); }
function routeSchema(R){ const W=300; let s=`<svg viewBox="0 0 ${W} 30" preserveAspectRatio="none"><line x1="6" y1="15" x2="${W-6}" y2="15" stroke="#3a4350" stroke-width="3"/>`;
  R.stops.forEach(st=>{ const x=6+(W-12)*(st.k==='st'?st.x+PL/2:st.x)/R.world; s+= st.k==='st'?`<circle cx="${x}" cy="15" r="6" fill="#e7eaee" stroke="#0f1318" stroke-width="2"/>`:`<rect x="${x-5}" y="10" width="10" height="10" fill="#f0a020" stroke="#0f1318" stroke-width="2"/>`; });
  return s+'</svg>'; }
function routeCargos(R){ const set=new Set(); R.stops.forEach(s=>{ if(s.load) set.add(s.load); }); return [...set]; }
function buildMenu(){
  $('routes').innerHTML=''; ROUTES.forEach(R=>{ const b=document.createElement('button'); b.className='rcard'; b.dataset.id=R.id;
    const nSt=R.stops.filter(s=>s.k==='st').length, nFr=R.stops.length-nSt, cg=routeCargos(R);
    b.innerHTML=`<div class="rtop"><span class="lbl">${R.label}</span><span class="km">${(R.world/2000).toFixed(1).replace('.',',')} km · ${nSt} gares${nFr?' · '+nFr+' grues':''}</span></div>
     <h3>${R.name}</h3><p>${R.desc}</p>${routeSchema(R)}<div class="cargos"><span class="cg">Voyageurs</span>${cg.map(x=>`<span class="cg">${CARGO_NAME[x]}</span>`).join('')}</div>`;
    b.onclick=()=>{ if(ROUTE!==R){ ROUTE=R; COMP=R.rec.slice(); save(); refreshMenu(); } }; $('routes').appendChild(b); });
  $('locos').innerHTML=''; LOCOS.forEach(l=>{ const b=document.createElement('button'); b.className='lcard'; b.dataset.id=l.id;
    b.innerHTML=`<canvas></canvas><div class="nm">${l.name}</div><div class="meta">${l.kind} · ${Math.round(l.max*.6)} km/h</div>`; b.onclick=()=>{ LOCO=l; save(); refreshMenu(); }; $('locos').appendChild(b); });
  const sw=$('swatches'); sw.innerHTML=''; LIVERIES.forEach(([c,n])=>{ const b=document.createElement('button'); b.className='sw'; b.style.background=c; b.dataset.c=c; b.title=n; b.onclick=()=>{ COLOR=c; save(); refreshMenu(); }; sw.appendChild(b); });
  const lab=document.createElement('label'); lab.className='cust'; lab.innerHTML='Autre <input type="color" id="custC">'; sw.appendChild(lab);
  $('custC').value=COLOR; $('custC').oninput=e=>{ COLOR=e.target.value; save(); refreshMenu(); };
  $('addW').onclick=()=>{ if(COMP.length<MAXW){ COMP.push('pax'); save(); refreshMenu(); } };
  $('recW').onclick=()=>{ COMP=ROUTE.rec.slice(); save(); refreshMenu(); };
  refreshMenu();
}
function buildSlots(){
  const box=$('slots'); box.innerHTML='';
  COMP.forEach((t,i)=>{ const row=document.createElement('div'); row.className='slot';
    row.innerHTML=`<span class="sn">Wagon ${i+1}</span><div class="opts">${Object.keys(WTYPES).map(k=>`<button class="opt${k===t?' sel':''}" data-k="${k}"><canvas></canvas>${WTYPES[k].short}</button>`).join('')}</div><button class="rm" title="Retirer">×</button>`;
    row.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{ COMP[i]=o.dataset.k; save(); refreshMenu(); });
    row.querySelector('.rm').onclick=()=>{ if(COMP.length>1){ COMP.splice(i,1); save(); refreshMenu(); } };
    row.querySelector('.rm').disabled=COMP.length<=1; box.appendChild(row);
    row.querySelectorAll('.opt canvas').forEach((cv,j)=>previewWagon(cv,Object.keys(WTYPES)[j])); });
  $('addW').disabled=COMP.length>=MAXW;
}
function refreshMenu(){
  document.querySelectorAll('.rcard').forEach(b=>b.classList.toggle('sel',b.dataset.id===ROUTE.id));
  document.querySelectorAll('.lcard').forEach(b=>{ const l=LOCOS.find(x=>x.id===b.dataset.id); b.classList.toggle('sel',l===LOCO); previewLoco(b.querySelector('canvas'),l); });
  document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('sel',b.dataset.c.toLowerCase()===COLOR.toLowerCase()));
  const nm=LIVERIES.find(l=>l[0].toLowerCase()===COLOR.toLowerCase()); $('colName').textContent='Livrée : '+(nm?nm[1]:'personnalisée');
  buildSlots(); previewComp();
  const need=routeCargos(ROUTE), miss=need.filter(cg=>!COMP.includes(WAGON_FOR[cg]));
  const warn=[]; if(miss.length) warn.push('Ce parcours transporte : '+miss.map(c=>CARGO_NAME[c].toLowerCase()).join(', ')+'. Ajoute le wagon qui va avec pour réussir toutes les missions.');
  if(!COMP.includes('pax')) warn.push('Sans voiture voyageurs, personne ne pourra monter.');
  $('compWarn').textContent=warn.join(' ');
  $('sumTxt').textContent=`${ROUTE.name} (${ROUTE.label.toLowerCase()}) · ${LOCO.name} · ${COMP.length} wagon${COMP.length>1?'s':''}`;
}

const G={active:false};
const input={fwd:false,back:false,brake:false};
let STOPS=[],STATIONS=[],TERMS=[],LASTI=0,WORLD=7000,TL=0;
let TREES=[],FG=[],HOUSES=[],CITY=[],CLOUDS=[];
const SKINS=['#e8bfa0','#c68863','#8d5524','#f1d3bd','#d9a066'], HAIRS=['#2b2018','#121212','#8a6a3a','#5a2e18','#6d6d6d','#b8b0a2'];
const COATS=['#3d4a5c','#6b3a3a','#3f5a46','#7a6a4a','#2f3540','#5a4a6a','#8a5a3a','#44607a','#9a8f7a'];

function buildWorld(R){
  WORLD=R.world; STOPS=R.stops.map(s=>Object.assign({},s)); STATIONS=STOPS.filter(s=>s.k==='st'); TERMS=STOPS.filter(s=>s.k==='fr'); LASTI=STATIONS.length-1;
  const rng=mulberry32(R.id.length*977+13);
  const zoneAt=x=>{let z='grass'; for(const [a,t] of R.zones) if(x>=a) z=t; return z;};
  G.zoneAt=zoneAt;
  const blocked=x=>{ for(const s of STATIONS) if(x>s.x-150&&x<s.x+PL+150) return true; for(const T of TERMS) if(Math.abs(x-T.x)<400) return true;
    for(const c of R.crossings) if(Math.abs(x-c)<120) return true; if(R.tunnel&&x>R.tunnel[0]-90&&x<R.tunnel[1]+90) return true; if(R.bridge&&x>R.bridge[0]-50&&x<R.bridge[1]+50) return true;
    const z=zoneAt(x); return z==='city'||z==='port'; };
  TREES=[]; for(let x=60;x<WORLD;){ const z=zoneAt(x); x+= z==='forest'?24+rng()*46:z==='snow'?40+rng()*80:60+rng()*120; if(!blocked(x)) TREES.push({x,s:.75+rng()*.55,y:266+rng()*18,z:zoneAt(x),t:rng()}); }
  TREES.sort((a,b)=>a.y-b.y);
  FG=[]; for(let x=30;x<WORLD;x+=34+rng()*70){ const onP=STATIONS.some(s=>x>s.x-20&&x<s.x+PL+20)||TERMS.some(T=>Math.abs(x-T.x)<380)||R.crossings.some(c=>Math.abs(x-c)<100)||(R.bridge&&x>R.bridge[0]-20&&x<R.bridge[1]+20);
    if(!onP) FG.push({x,y:340+rng()*50,z:zoneAt(x),t:rng()}); }
  HOUSES=[]; STATIONS.forEach((s,i)=>{ if(zoneAt(s.x)==='city') return;
    HOUSES.push({x:s.x-128,w:62,h:40,c:['#d8cdb9','#cfc6b4','#e0d6c2'][i%3],r:['#8a4b3a','#5a5f69','#7a4434'][i%3]});
    HOUSES.push({x:s.x+PL+64,w:70,h:46,c:['#e0d6c2','#d2c7b1','#c9c2b4'][i%3],r:['#5a5f69','#8a4b3a','#6a4a3a'][i%3]}); });
  CITY=[]; for(let x=0;x<WORLD+200;x+=44+rng()*46){ if(zoneAt(x)!=='city') continue; if(R.crossings.some(c=>Math.abs(x-c)<90)) continue;
    CITY.push({x,w:48+rng()*44,h:80+rng()*150,c:['#7d8794','#939ca8','#6c7581','#a7afb9','#858aa0'][Math.floor(rng()*5)]}); }
  CLOUDS=[]; for(let i=0;i<9;i++) CLOUDS.push({x:i*300+rng()*200,y:26+rng()*80,s:.7+rng()*.8});
  G.R=R;
}
function wagonLeft(k){ return G.pos-LOCO_L-GAP-WAG_L-k*(GAP+WAG_L); }
function wagonCenter(k){ return wagonLeft(k)+WAG_L/2; }
function paxSpan(){ const ks=[]; G.wagons.forEach((w,k)=>{ if(w.type==='pax') ks.push(k); }); if(!ks.length) return null; return {front:wagonLeft(Math.min(...ks))+WAG_L,back:wagonLeft(Math.max(...ks))}; }
function mkLoad(cargo){ return {cargo,color:pick(CONT_COLORS),seed:Math.random()}; }

function newGame(){
  buildWorld(ROUTE);
  TL=LOCO_L+COMP.length*(GAP+WAG_L);
  Object.assign(G,{active:true,speed:0,dist:0,doorsOpen:false,doorAnim:0,dock:null,pax:[],score:0,delivered:0,loadsDone:0,perfect:0,particles:[],floaters:[],timer:0,time:0,
    camX:null,chugAcc:0,smokeT:0,departArmed:null,doneMsg:false,ended:false,lastWarn:-9,endTimer:null,hornHeld:false,useful:0,
    wagons:COMP.map(t=>({type:t,cargo:null,seats:t==='pax'?Array(8).fill(null):null}))});
  // start: passenger part centered on first platform
  const s0=STATIONS[0]; const ks=G.wagons.map((w,k)=>w.type==='pax'?k:-1).filter(k=>k>=0);
  let offFront=0, spanLen=TL; if(ks.length){ const kmin=Math.min(...ks),kmax=Math.max(...ks); offFront=LOCO_L+GAP+kmin*(GAP+WAG_L); spanLen=(kmax-kmin+1)*(WAG_L+GAP)-GAP; }
  G.pos=s0.x+PL/2+spanLen/2+offFront; if(G.pos-TL<60) G.pos=60+TL;
  STATIONS.forEach(s=>s.docked=false); G.crossings=ROUTE.crossings.map(x=>({x,honked:false,arm:0,active:false}));
  // passengers
  const C=8*ks.length, n=Math.min(5,Math.floor(C/Math.max(1,LASTI)));
  for(let i=0;i<LASTI;i++){ const s=STATIONS[i];
    for(let k=0;k<n;k++){ const dest=i+1+Math.floor(Math.random()*(LASTI-i));
      G.pax.push({st:i,dest,state:'waiting',x:s.x+90+(k+.5)*(PL-180)/n+(Math.random()*24-12),y:FEET,alpha:1,skin:pick(SKINS),hair:pick(HAIRS),shirt:pick(COATS),leg:Math.random()<.5?'#2a2e35':'#4a4136',sz:.9+Math.random()*.2,ph:Math.random()*6,bag:Math.random()<.45,t:0}); } }
  G.totalPax=G.pax.length;
  // terminals & missions
  const cnt=t=>G.wagons.filter(w=>w.type===t).length;
  TERMS.forEach(T=>{ T.piles={};
    if(T.load) T.piles.stock={x:T.x-170,dir:-1,cargo:T.load,items:Array.from({length:cnt(WAGON_FOR[T.load])},()=>mkLoad(T.load))};
    if(T.unload) T.piles.drop={x:T.load?T.x+170:T.x-170,dir:T.load?1:-1,cargo:T.unload,items:[]};
    T.tx=T.x-40; T.hy=HOOK_REST; T.job=null; T.carry=null; });
  G.missions=TERMS.filter(T=>T.load).map(T=>({cargo:T.load,from:T.name,to:(TERMS.find(u=>u.unload===T.load)||{}).name,total:cnt(WAGON_FOR[T.load]),done:0}));
  $('finishBtn').classList.add('hidden'); $('bCrane').classList.toggle('hidden',!TERMS.length);
  updateDoorBtn(); buildMinimap(); lastInfo='';
}

function stationZone(){
  const sp=paxSpan(), front=sp?sp.front:G.pos, back=sp?sp.back:G.pos-TL;
  for(let i=0;i<STATIONS.length;i++){ const s=STATIONS[i], a=s.x, b=s.x+PL;
    if(G.pos>a-40&&G.pos-TL<b+40) return {i,s,ok:back>=a-12&&front<=b+12,off:(front+back)/2-(a+PL/2),hasPax:!!sp,front,back,a,b}; }
  return null;
}
function freightCheck(){
  const center=G.pos-TL/2;
  for(const T of TERMS){
    if(Math.abs(center-T.x)>TL/2+380) continue;
    let best=-1,bd=0,act=null;
    G.wagons.forEach((w,k)=>{ let a=null;
      if(w.cargo&&T.unload===w.cargo.cargo) a='unload';
      else if(!w.cargo&&T.load&&WAGON_FOR[T.load]===w.type&&T.piles.stock.items.length) a='load';
      if(a){ const d=T.x-wagonCenter(k); if(best<0||Math.abs(d)<Math.abs(bd)){ bd=d; best=k; act=a; } } });
    return {T,k:best,delta:bd,action:act,ok:best>=0&&Math.abs(bd)<=TOL&&Math.abs(G.speed)<1&&!T.job};
  }
  return null;
}
function addScore(n,text,x){ G.score+=n; G.floaters.push({x,y:RAIL_Y-130,text,life:1.8}); }
let toastT=null; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
function updateDoorBtn(){ $('bDoors').classList.toggle('open',!!G.doorsOpen); $('doorLbl').textContent=G.doorsOpen?'Fermer portes':'Ouvrir portes'; }
const busyPax=()=>G.pax.some(p=>p.state==='boarding'||p.state==='alighting');
const craneBusy=()=>TERMS.some(T=>T.job);
function allDone(){ return G.delivered>=G.totalPax&&G.missions.every(m=>m.done>=m.total); }

function toggleDoors(){
  Sound.init(); vib(); if(!G.active||G.ended) return;
  if(G.doorsOpen){ if(busyPax()){ toast('Attends, des voyageurs passent la porte.'); return; }
    G.doorsOpen=false; Sound.beep(); G.departArmed={x:G.pos,bonus:false}; G.dock=null; G.doneMsg=false; updateDoorBtn(); return; }
  if(!G.wagons.some(w=>w.type==='pax')){ toast('Ton train n’a pas de voiture voyageurs.'); return; }
  if(Math.abs(G.speed)>.5){ toast('Arrête complètement le train avant d’ouvrir.'); return; }
  const z=stationZone();
  if(!z){ toast('Pas de quai ici : les portes restent fermées.'); return; }
  if(!z.ok){ toast(z.front>z.b+12?`Trop loin : recule de ${meters(z.front-z.b-12)} m`:`Pas encore à quai : avance de ${meters(z.a-12-z.back)} m`); return; }
  G.doorsOpen=true; G.dock=z.i; G.timer=.9; G.doneMsg=false; Sound.chime(); toast(`Gare de ${z.s.name}`);
  if(!z.s.docked){ z.s.docked=true; if(Math.abs(z.off)<30){ G.perfect++; addScore(15,'Arrêt parfait +15',(z.front+z.back)/2); } }
  updateDoorBtn(); refreshMinimapDone();
}
function craneAction(){
  Sound.init(); vib(); if(!G.active||G.ended) return;
  const f=freightCheck();
  if(!f){ toast('Aucune grue ici.'); return; }
  if(f.T.job) return;
  if(f.k<0){ const T=f.T; const hasType=G.wagons.some(w=>(T.load&&w.type===WAGON_FOR[T.load])||(T.unload&&w.type===WAGON_FOR[T.unload]));
    toast(!hasType?'Ton train n’a pas de wagon adapté à cette grue.':'Rien à charger ni à décharger ici.'); return; }
  if(Math.abs(G.speed)>.5){ toast('Arrête le train d’abord.'); return; }
  if(Math.abs(f.delta)>TOL){ toast(f.delta>0?`Avance encore de ${meters(f.delta)} m`:`Recule de ${meters(f.delta)} m`); return; }
  startJob(f.T,f.k,f.action);
}
function pilePos(P,i){ const L=LOADS[P.cargo]; return {x:P.x+P.dir*Math.floor(i/2)*(L.w+14),bottom:PILE_BASE-(i%2)*L.h}; }
const hookFor=(bottom,h)=>bottom-h-HOOK_GAP;
function startJob(T,k,action){
  const wx=wagonCenter(k), deck=RAIL_Y-(G.wagons[k].type==='crates'?33:G.wagons[k].type==='cont'?32:35);
  let st;
  if(action==='load'){ const P=T.piles.stock, h=LOADS[P.cargo].h, pp=pilePos(P,P.items.length-1);
    st=[{t:'x',v:pp.x},{t:'y',v:hookFor(pp.bottom,h)},{t:'grab'},{t:'y',v:HOOK_REST},{t:'x',v:wx},{t:'y',v:hookFor(deck,h)},{t:'rel'},{t:'y',v:HOOK_REST},{t:'x',v:T.x-40}]; }
  else { const P=T.piles.drop, h=LOADS[P.cargo].h, pp=pilePos(P,P.items.length);
    st=[{t:'x',v:wx},{t:'y',v:hookFor(deck,h)},{t:'grab'},{t:'y',v:HOOK_REST},{t:'x',v:pp.x},{t:'y',v:hookFor(pp.bottom,h)},{t:'rel'},{t:'y',v:HOOK_REST},{t:'x',v:T.x-40}]; }
  T.job={st,i:0,w:0,k,action}; toast(action==='load'?'La grue charge le wagon…':'La grue décharge le wagon…');
}
function updateCrane(T,dt){
  const j=T.job; if(!j) return false; const s=j.st[j.i]; let done=false, moving=false;
  if(s.t==='x'){ T.tx=approach(T.tx,s.v,150*dt); done=T.tx===s.v; moving=true; }
  else if(s.t==='y'){ T.hy=approach(T.hy,s.v,115*dt); done=T.hy===s.v; moving=true; }
  else { j.w+=dt; if(j.w>=.45){ j.w=0; done=true; const w=G.wagons[j.k]; Sound.clunk(); vib(20);
    if(s.t==='grab'){ if(j.action==='load') T.carry=T.piles.stock.items.pop(); else { T.carry=w.cargo; w.cargo=null; } }
    else { if(j.action==='load'){ w.cargo=T.carry; T.carry=null; addScore(10,'Chargé +10',wagonCenter(j.k)); }
      else { const ld=T.carry; T.piles.drop.items.push(ld); T.carry=null; const m=G.missions.find(m=>m.cargo===ld.cargo); if(m) m.done++; G.loadsDone++; addScore(40,'Livré +40',T.piles.drop.x); toast(`${CARGO_NAME[ld.cargo]} livrés à ${T.name} ✓`); } } } }
  if(done){ j.i++; if(j.i>=j.st.length) T.job=null; }
  return moving;
}
function hornPress(){
  Sound.init(); if(!G.active||G.ended||G.hornHeld) return; vib(); G.hornHeld=true; Sound.hornStart(LOCO.horn);
  if(G.departArmed&&!G.departArmed.bonus&&!G.doorsOpen&&Math.abs(G.pos-G.departArmed.x)<160){ G.departArmed.bonus=true; G.useful++; addScore(5,'Départ annoncé +5',G.pos-60); }
  for(const c of G.crossings){ const d=c.x-G.pos; if(!c.honked&&d>0&&d<650&&G.speed>5){ c.honked=true; G.useful++; addScore(5,'Passage à niveau +5',c.x); } }
}
function hornRelease(){ G.hornHeld=false; Sound.hornStop(); }

function endGame(){
  if(G.ended) return; G.ended=true; Sound.stopEngine(); hornRelease();
  const tot=G.totalPax+G.missions.reduce((a,m)=>a+m.total*4,0), got=G.delivered+G.missions.reduce((a,m)=>a+m.done*4,0);
  const r=tot?got/tot:1, n=r>=.99?3:r>=.6?2:1;
  $('eTitle').textContent=r>=.99?'Mission accomplie':'Terminus';
  $('eStars').innerHTML=[0,1,2].map(i=>`<svg width="44" height="44" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7.1L12 17.3 5.8 21l1.6-7.1L2 9.2l7.1-.6z" fill="${i<n?'#f0a020':'#2a323d'}"/></svg>`).join('');
  const m=Math.floor(G.time/60), s=Math.floor(G.time%60);
  let html=`Parcours <b>${ROUTE.name}</b><br>Voyageurs arrivés <b>${G.delivered} / ${G.totalPax}</b><br>`;
  G.missions.forEach(ms=>html+=`${CARGO_NAME[ms.cargo]} livrés <b>${ms.done} / ${ms.total}</b><br>`);
  html+=`Arrêts parfaits <b>${G.perfect}</b><br>Klaxons utiles <b>${G.useful}</b><br>Temps <b>${m} min ${String(s).padStart(2,'0')}</b><br>Score <b>${G.score}</b>`;
  $('eStats').innerHTML=html; $('endOv').classList.remove('hidden');
}

/* ====================== update ====================== */
const BRAKE=280, FRICTION=45, YARD_V=75;
function emit(o){ G.particles.push(Object.assign({g:0},o,{max:o.life})); }
let craneReady=false;
function update(dt){
  G.time+=dt;
  const loaded=G.wagons.filter(w=>w.cargo).length;
  const acc=LOCO.acc/(1+.1*loaded);
  const center=G.pos-TL/2;
  const inYard=TERMS.some(T=>Math.abs(center-T.x)<TL/2+330);
  const vmax=inYard?Math.min(LOCO.max,YARD_V):LOCO.max;
  let accel=false; const want=input.fwd||input.back;
  if(G.ended) G.speed=approach(G.speed,0,BRAKE*dt);
  else if(G.doorsOpen||G.doorAnim>0||craneBusy()){
    if(want&&G.time-G.lastWarn>1.8){ toast(craneBusy()?'La grue travaille, patiente…':'Ferme les portes avant de rouler.'); G.lastWarn=G.time; }
    G.speed=0;
  } else if(input.brake) G.speed=approach(G.speed,0,BRAKE*dt);
  else if(input.fwd){ if(G.speed<0) G.speed=approach(G.speed,0,BRAKE*dt); else { G.speed=G.speed>vmax?approach(G.speed,vmax,BRAKE*.6*dt):Math.min(vmax,G.speed+acc*dt*(1-.45*G.speed/LOCO.max)); accel=true; } }
  else if(input.back){ const vb=Math.min(vmax,LOCO.max*.35); if(G.speed>0) G.speed=approach(G.speed,0,BRAKE*dt); else { G.speed=Math.max(-vb,G.speed-acc*.7*dt); accel=true; } }
  else G.speed=approach(G.speed,0,FRICTION*dt);
  if(!want&&Math.abs(G.speed)>vmax) G.speed=approach(G.speed,Math.sign(G.speed)*vmax,BRAKE*.6*dt);
  G.limited=inYard&&!G.ended;

  G.pos+=G.speed*dt; G.dist+=G.speed*dt;
  if(G.pos>WORLD-70){ G.pos=WORLD-70; if(G.speed>0){ G.speed=0; toast('Fin de la voie.'); } }
  if(G.pos-TL<50){ G.pos=50+TL; if(G.speed<0){ G.speed=0; toast('Fin de la voie.'); } }
  G.doorAnim=approach(G.doorAnim,G.doorsOpen?1:0,dt*2.2);
  if(G.departArmed&&Math.abs(G.pos-G.departArmed.x)>320) G.departArmed=null;
  for(const c of G.crossings){ c.active=G.pos>c.x-700&&G.pos-TL<c.x+60; c.arm=approach(c.arm,c.active?1:0,dt*1.3); }

  // passengers flow
  if(G.doorsOpen&&G.doorAnim>=1&&G.dock!==null){
    G.timer-=dt;
    if(G.timer<=0){ const si=G.dock; let found=null;
      G.wagons.forEach((w,k)=>{ if(found||w.type!=='pax') return; w.seats.forEach((p,s)=>{ if(!found&&p&&p.skin&&p.dest===si) found={k,s,p}; }); });
      if(found){ const {k,s,p}=found; G.wagons[k].seats[s]=null; Object.assign(p,{state:'alighting',x:wagonLeft(k)+65,y:FEET-14,alpha:0,t:0,dir:Math.random()<.5?-1:1}); G.timer=.45; }
      else { const w=G.pax.find(p=>p.state==='waiting'&&p.st===si); let free=null;
        G.wagons.forEach((wg,k)=>{ if(free||wg.type!=='pax') return; const s=wg.seats.findIndex(x=>!x); if(s>=0) free={k,s}; });
        if(w&&free){ G.wagons[free.k].seats[free.s]={reserved:true}; Object.assign(w,{state:'boarding',sk:free.k,ss:free.s,tx:wagonLeft(free.k)+65,entering:false,t:0}); G.timer=.4; }
        else if(!busyPax()){ if(!G.doneMsg){ G.doneMsg=true;
            if(si===LASTI){ if(allDone()){ G.endTimer=1.6; toast('Tout est livré, bravo !'); } else toast('Terminus. Il reste des missions : tu peux terminer ou repartir.'); }
            else toast('Tout le monde est installé : ferme les portes et klaxonne.'); }
          G.timer=.3; }
        else G.timer=.2; } }
  }
  // terminus finish
  const z=stationZone(); const atTerm=z&&z.i===LASTI&&Math.abs(G.speed)<1;
  $('finishBtn').classList.toggle('hidden',!(atTerm&&!G.ended&&!busyPax()));
  if(atTerm&&!G.doorsOpen&&allDone()&&G.endTimer===null&&!G.ended&&!busyPax()&&!craneBusy()) G.endTimer=1.2;
  if(G.endTimer!==null){ G.endTimer-=dt; if(G.endTimer<=0){ G.endTimer=null; endGame(); } }

  for(const p of G.pax){
    if(p.state==='boarding'){
      if(!p.entering){ const d=p.tx-p.x, st=110*dt; if(Math.abs(d)<=st){ p.x=p.tx; p.entering=true; p.t=0; } else p.x+=Math.sign(d)*st; }
      else { p.t+=dt; const k=Math.min(1,p.t/.35); p.y=FEET-14*k; p.alpha=1-k; if(k>=1){ p.state='onboard'; G.wagons[p.sk].seats[p.ss]=p; p.alpha=1; p.y=FEET; } }
    } else if(p.state==='alighting'){
      p.t+=dt; if(p.t<.35){ const k=p.t/.35; p.alpha=k; p.y=FEET-14+14*k; }
      else { p.y=FEET; p.alpha=p.t>1.6?Math.max(0,1-(p.t-1.6)/.5):1; p.x+=p.dir*55*dt; if(p.t>2.1){ p.state='gone'; G.delivered++; addScore(10,'+10',p.x); Sound.ding(); } }
    }
  }
  // cranes
  let motor=false; for(const T of TERMS) if(updateCrane(T,dt)) motor=true; Sound.setMotor(motor&&!G.ended);
  const fc=freightCheck(); craneReady=!!(fc&&fc.ok); G.fc=fc;

  // smoke
  const frac=Math.abs(G.speed)/LOCO.max, ll=G.pos-LOCO_L, ch=LOCO.ch;
  if(LOCO.fx==='steam'){
    G.chugAcc+=Math.abs(G.speed*dt);
    while(G.chugAcc>26){ G.chugAcc-=26; emit({x:ll+ch.x,y:RAIL_Y+ch.y,vx:-G.speed*.2+(Math.random()*20-10),vy:-55-Math.random()*30,r:7,gr:22,life:1.9,col:'220,222,226',a:.75}); if(!G.ended) Sound.chug(.05+.12*frac); }
    G.smokeT-=dt; if(G.smokeT<=0){ G.smokeT=.8; emit({x:ll+ch.x,y:RAIL_Y+ch.y,vx:Math.random()*10-5,vy:-28,r:5,gr:12,life:1.8,col:'200,202,207',a:.55}); }
    if(G.hornHeld&&LOCO.whistle&&Math.random()<dt*30) emit({x:ll+LOCO.whistle.x,y:RAIL_Y+LOCO.whistle.y,vx:-G.speed*.3+Math.random()*16-8,vy:-70,r:3,gr:16,life:.7,col:'245,245,245',a:.8});
  } else if(LOCO.fx==='diesel'){
    G.smokeT-=dt; if(G.smokeT<=0){ G.smokeT=accel?.07:.45; emit({x:ll+ch.x,y:RAIL_Y+ch.y,vx:-G.speed*.25+Math.random()*10-5,vy:-40-Math.random()*20,r:accel?5:3.5,gr:12,life:accel?1.1:.8,col:accel?'60,60,66':'110,110,116',a:.5}); }
  } else if(frac>.05&&Math.random()<dt*6*frac){ for(let i=0;i<3;i++) emit({x:ll+ch.x,y:RAIL_Y+ch.y,vx:Math.random()*120-60,vy:-Math.random()*60,g:300,r:1.6,gr:0,life:.4,col:'255,226,140',a:1}); }
  for(const p of G.particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt; p.r+=p.gr*dt; p.life-=dt; }
  G.particles=G.particles.filter(p=>p.life>0);
  for(const f of G.floaters){ f.life-=dt; f.y-=22*dt; } G.floaters=G.floaters.filter(f=>f.life>0);
  Sound.updateEngine(G.ended?0:frac,accel);
  updateHud();
}

/* ====================== HUD ====================== */
let lastInfo='';
function nextStop(){
  if(G.dock!==null) return {s:STATIONS[G.dock],d:0,here:true};
  const center=G.pos-TL/2, cx=s=>s.k==='st'?s.x+PL/2:s.x;
  let t=null;
  if(G.speed<-1){ for(let i=STOPS.length-1;i>=0;i--) if(cx(STOPS[i])<center-30){ t=STOPS[i]; break; } }
  if(!t) t=STOPS.find(s=>cx(s)>center-30)||STOPS[STOPS.length-1];
  return {s:t,d:Math.abs(cx(t)-center)};
}
function fmtD(px){ const m=px/2; return m<15?'ici':m>=1000?(m/1000).toFixed(1).replace('.',',')+' km':Math.round(m/10)*10+' m'; }
function updateHud(){

  const key=[nm,fmtD(ns.d),misTxt,G.wagons.map(w=>w.cargo?w.cargo.cargo:w.seats?w.seats.filter(p=>p&&p.skin).length:'').join(',')].join('|');

    $('hNextL').textContent=`${nm} · ${fmtD(ns.d)}`; $('hMisL').textContent=misTxt;

    G.missions.forEach(m=>{ h+=`<div class="mrow${m.total&&m.done>=m.total?' done':''}${m.total?'':' na'}"><span class="dot" style="background:#f0a020"></span><span class="mt">${CARGO_NAME[m.cargo]} : ${m.from} → ${m.to}${m.total?'':' (pas de wagon)'}</span><span class="bar"><i style="width:${m.total?100*m.done/m.total:0}%"></i></span><span class="v">${m.done}/${m.total}</span></div>`; });
    $('iMis').innerHTML=h;
    $('iWag').innerHTML=G.wagons.map((w,k)=>{ if(w.type==='pax'){ const n=w.seats.filter(p=>p&&p.skin).length; return `<span class="wchip${n?' full':''}">${k+1}. Voyageurs ${n}/8</span>`; }
      return `<span class="wchip${w.cargo?' full':''}">${k+1}. ${WTYPES[w.type].short} : ${w.cargo?'chargé':'vide'}</span>`; }).join('');
  }
  $('mmT').style.left=(100*(G.pos-TL/2)/WORLD)+'%'; $('mmT').style.width=Math.max(10,100*TL/WORLD)+'%';
  const h=computeHint(); if($('hint').textContent!==h) $('hint').textContent=h;
  const z=stationZone(); const doorReady=!G.doorsOpen&&z&&z.ok&&z.hasPax&&Math.abs(G.speed)<1&&!G.ended;

}
function computeHint(){
  if(G.ended) return '';
  const busy=TERMS.find(T=>T.job); if(busy) return busy.job.action==='load'?'La grue charge le wagon…':'La grue décharge le wagon…';
  if(G.doorsOpen){ if(!G.doneMsg) return 'Les voyageurs descendent et montent…';
    if(G.dock===LASTI) return allDone()?'Terminus : tout est livré !':'Terminus : appuie sur « Terminer » ou repars finir tes missions.';
    return 'Ferme les portes, klaxonne, puis repars.'; }
  const fc=G.fc;
  if(fc){ if(fc.k<0){ if(Math.abs(G.speed)<60) return `${fc.T.name} : rien à faire ici pour ton train.`; }
    else { const nm=WTYPES[G.wagons[fc.k].type].the, verb=fc.action==='load'?'charger':'décharger';
      if(Math.abs(fc.delta)<=TOL) return Math.abs(G.speed)<1?`${nm[0].toUpperCase()+nm.slice(1)} est en place : appuie sur GRUE pour ${verb}.`:'Freine : le wagon est sous la grue !';
      return `${fc.T.name} : ${fc.delta>0?'avance':'recule'} de ${meters(fc.delta)} m pour placer ${nm} sous la grue.`; } }
  const z=stationZone();
  if(z&&z.hasPax){ if(Math.abs(G.speed)<1){ if(z.ok) return `En gare de ${z.s.name} : ouvre les portes.`;
      return z.front>z.b+12?`Trop loin : recule de ${meters(z.front-z.b-12)} m.`:`Avance encore de ${meters(z.a-12-z.back)} m jusqu’au quai.`; }

/* ====================== loop & input ====================== */
let lastT=performance.now();
function loop(now){ const dt=Math.min(.05,(now-lastT)/1000); lastT=now; if(G.active){ update(dt); render(); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);

function holdBtn(el,on,off){
  const down=e=>{ e.preventDefault(); Sound.init(); vib(); el.classList.add('down'); try{el.setPointerCapture(e.pointerId);}catch(_){} on(); };
  const up=()=>{ if(!el.classList.contains('down')) return; el.classList.remove('down'); off(); };
  el.addEventListener('pointerdown',down); ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,up));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
holdBtn($('bFwd'),()=>input.fwd=true,()=>input.fwd=false);
holdBtn($('bBack'),()=>input.back=true,()=>input.back=false);
holdBtn($('bBrake'),()=>input.brake=true,()=>input.brake=false);
holdBtn($('bHorn'),hornPress,hornRelease);
function tapBtn(el,fn){ el.addEventListener('pointerdown',e=>{ e.preventDefault(); el.classList.add('down'); fn(); }); ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>el.classList.remove('down'))); el.addEventListener('contextmenu',e=>e.preventDefault()); }
tapBtn($('bDoors'),toggleDoors); tapBtn($('bCrane'),craneAction);
document.addEventListener('gesturestart',e=>e.preventDefault());
$('game').addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

const KEYMAP={ArrowRight:'fwd',KeyD:'fwd',ArrowLeft:'back',KeyA:'back',KeyQ:'back',ArrowDown:'brake',KeyS:'brake',Space:'brake'};
window.addEventListener('keydown',e=>{ if(!G.active||G.ended) return;
  if(KEYMAP[e.code]){ e.preventDefault(); Sound.init(); input[KEYMAP[e.code]]=true; }
  else if(e.code==='KeyK'||e.code==='KeyH'){ e.preventDefault(); if(!e.repeat) hornPress(); }
  else if(e.code==='KeyP'||e.code==='KeyO'){ e.preventDefault(); if(!e.repeat) toggleDoors(); }
  else if(e.code==='KeyG'||e.code==='Enter'){ e.preventDefault(); if(!e.repeat) craneAction(); } });
window.addEventListener('keyup',e=>{ if(KEYMAP[e.code]) input[KEYMAP[e.code]]=false; if(e.code==='KeyK'||e.code==='KeyH') hornRelease(); });
window.addEventListener('blur',()=>{ input.fwd=input.back=input.brake=false; if(G.active) hornRelease(); document.querySelectorAll('.ctl.down').forEach(b=>b.classList.remove('down')); });

function startGame(){
  $('menu').classList.add('hidden'); $('endOv').classList.add('hidden'); $('game').classList.remove('hidden');
  Sound.init(); newGame(); Sound.startEngine(LOCO.fx==='steam'?'steam':LOCO.fx==='diesel'?'diesel':'electric');
  refreshMinimapDone(); toast(G.wagons.some(w=>w.type==='pax')?'Ouvre les portes pour faire monter les voyageurs.':'En route ! Avance jusqu’à la première grue.');
}
function toMenu(){ G.active=false; Sound.stopEngine(); hornRelease(); $('game').classList.add('hidden'); $('endOv').classList.add('hidden'); $('menu').classList.remove('hidden'); refreshMenu(); }
$('startBtn').onclick=startGame; $('againBtn').onclick=startGame; $('backBtn').onclick=toMenu; $('menuBtn').onclick=toMenu;
$('finishBtn').onclick=()=>endGame();
$('sndBtn').onclick=()=>{ Sound.init(); Sound.setOn(!Sound.on); $('sndWave').style.display=Sound.on?'':'none'; };
const fsOk=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen)&&(document.fullscreenEnabled||document.webkitFullscreenEnabled);
if(!fsOk) $('fsBtn').classList.add('hidden');
$('fsBtn').onclick=()=>{ try{ const d=document, el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); }
  else { const p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el); if(p&&p.then) p.then(()=>{ try{ screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} }).catch(()=>toast('Plein écran indisponible ici.')); } }catch(e){ toast('Plein écran indisponible ici.'); } };
let rsT=null; window.addEventListener('resize',()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ if(!$('menu').classList.contains('hidden')) refreshMenu(); },120); });
buildMenu();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(!$('menu').classList.contains('hidden')) refreshMenu(); });
